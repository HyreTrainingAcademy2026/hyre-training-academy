ent tiers:</strong></p>\n<p>Starter (under $200): Smartphone with good camera, clip-on microphone, ring light, phone tripod, natural window light.</p>\n<p>Intermediate ($200-$1,000): Mirrorless camera or high-end smartphone, wireless lavalier mic, two-point softbox lighting, adjustable tripod, basic backdrop.</p>\n<p>Professional ($1,000+): Dedicated camera body + lens kit, shotgun mic + audio recorder, three-point lighting setup, teleprompter, acoustic treatment, dedicated filming space.</p>\n<p><strong>Framing by platform:</strong></p>\n<ul>\n<li>Vertical 9:16 (1080x1920): Reels, TikTok, Stories, Shorts</li>\n<li>Square 1:1 (1080x1080): Feed posts, carousels</li>\n<li>Landscape 16:9 (1920x1080): YouTube long-form, LinkedIn video</li>\n<li>Portrait 4:5 (1080x1350): Instagram feed (maximum real estate)</li>\n</ul>\n<p><strong>Composition rules:</strong></p>\n<ol>\n<li>Rule of thirds: Place subject at intersection points</li>\n<li>Headroom: Don't cut off foreheads, leave breathing room</li>\n<li>Eye line: Camera at eye level for talking head</li>\n<li>Background: Clean, on-brand, not distracting</li>\n<li>Safe zones: Keep text/faces away from edges (platforms crop differently)</li>\n</ol>\n<p><strong>Lighting principles:</strong></p>\n<ul>\n<li>Key light: Main light source, 45 degrees from subject</li>\n<li>Fill light: Softer, opposite side, reduces harsh shadows</li>\n<li>Back light: Separates subject from background, adds depth</li>\n<li>Natural light: Face the window. Never backlight yourself unless intentional.</li>\n</ul>\n<p><strong>Audio quality checklist:</strong></p>\n<ul>\n<li>Record in a quiet space (no echo, no background noise)</li>\n<li>Mic within 6-12 inches of mouth</li>\n<li>Test levels before recording (peak at -6dB to -12dB)</li>\n<li>Record 10 seconds of room tone for noise removal</li>\n<li>Always monitor with headphones during recording</li>\n</ul>\n<h3>Chapter 4: Editing for Retention</h3>\n<p><strong>The retention curve reality:</strong><br />\nMost videos lose 30-50% of viewers in the first 5 seconds. Every second of your edit should earn the next second.</p>\n<p><strong>Pacing techniques:</strong></p>\n<ul>\n<li>Jump cuts: Remove dead air, ums, pauses. Keep energy high.</li>\n<li>B-roll inserts: Show what you're talking about. Visual variety resets attention.</li>\n<li>Text overlays: Reinforce key points. Viewers watch on mute.</li>\n<li>Zoom punches: Subtle 10-20% zooms on emphasis points.</li>\n<li>Sound effects: Subtle audio cues mark transitions (whoosh, pop, click).</li>\n<li>Pattern interrupts: Change something every 3-7 seconds (angle, graphic, movement).</li>\n</ul>\n<p><strong>Editing software by use case:</strong></p>\n<ul>\n<li>Quick social edits: CapCut (free, mobile + desktop, excellent templates)</li>\n<li>Text-based editing: Descript (edit video like a doc, auto-captions)</li>\n<li>Professional: Adobe Premiere Pro, DaVinci Resolve (free version is powerful)</li>\n<li>Motion graphics: After Effects, Canva (simpler animations)</li>\n</ul>\n<p><strong>Caption/subtitle standards:</strong></p>\n<ul>\n<li>Always add captions (85% of social video is watched on mute)</li>\n<li>Max 2 lines on screen at once</li>\n<li>Large, readable font (minimum 40pt equivalent)</li>\n<li>High contrast (white text, black outline or background box)</li>\n<li>Sync precisely to speech (no lag)</li>\n<li>Highlight keywords with color or bold</li>\n</ul>\n<p><strong>Thumbnail creation principles:</strong></p>\n<ul>\n<li>One clear focal point (face, object, or text)</li>\n<li>High contrast colors (stand out in a feed of muted tones)</li>\n<li>Readable at mobile size (test at 100px wide)</li>\n<li>Emotion on faces (surprise, curiosity, excitement)</li>\n<li>Minimal text (3-5 words maximum)</li>\n<li>Consistent brand style (recognizable in a grid)</li>\n</ul>\n<h3>Chapter 5: The Repurposing Engine</h3>\n<p><strong>The Content Multiplication Framework:</strong></p>\n<p>One long-form piece of content (webinar, podcast, YouTube video, live stream) becomes:</p>\n<ol>\n<li>Full YouTube video (long-form trust builder)</li>\n<li>5-8 short clips for Reels/TikTok/Shorts (discovery engines)</li>\n<li>Carousel post summarizing key points (save magnet)</li>\n<li>Quote graphics from best one-liners (shareable)</li>\n<li>Twitter/X thread breaking down the framework (authority)</li>\n<li>LinkedIn article or post (professional audience)</li>\n<li>Email newsletter recap (owned audience)</li>\n<li>Blog post with SEO optimization (evergreen search traffic)</li>\n<li>Podcast episode (audio-only audience)</li>\n<li>Pinterest infographic (long-tail discovery)</li>\n<li>Client-facing sales snippet (proof of expertise)</li>\n<li>Internal training clip (team development)</li>\n</ol>\n<p><strong>Critical rule:</strong> Repurposing is NOT copy-pasting. Each version must be:</p>\n<ul>\n<li>Reformatted for the platform's native style</li>\n<li>Re-hooked for that platform's audience behavior</li>\n<li>Re-edited for that platform's ideal length</li>\n<li>Re-captioned with platform-appropriate language</li>\n</ul>\n<p><strong>Repurposing workflow:</strong></p>\n<ol>\n<li>Record the hero piece (long-form video or live)</li>\n<li>Transcribe immediately (Descript, Otter, or YouTube auto-captions)</li>\n<li>Timestamp the best moments during review</li>\n<li>Batch-clip the short-form versions</li>\n<li>Write platform-specific captions for each</li>\n<li>Design any static assets (carousels, quotes, infographics)</li>\n<li>Schedule across platforms with staggered timing</li>\n<li>Track which repurposed versions perform best</li>\n</ol>\n<p><strong>Content batching system:</strong></p>\n<ul>\n<li>Film day: Record 4-8 videos in one session (same setup, different outfits)</li>\n<li>Edit day: Batch-edit all clips, add captions, create thumbnails</li>\n<li>Write day: Batch all captions, threads, newsletter copy</li>\n<li>Schedule day: Load everything into scheduling tools with dates and times</li>\n<li>Result: 2-4 batch days per month produces 30+ days of content</li>\n</ul>\n<h3>Chapter 6: Brand Voice and Messaging</h3>\n<p><strong>Voice development framework:</strong></p>\n<p>Step 1: Define 3-5 voice attributes (e.g., confident, witty, direct, warm, nerdy)</p>\n<p>Step 2: For each attribute, define what it IS and what it ISN'T:</p>\n<ul>\n<li>Confident: We state opinions clearly. We don't hedge with \"maybe\" or \"I think.\"</li>\n<li>Witty: We use clever observations. We don't use sarcasm that punches down.</li>\n<li>Direct: We get to the point fast. We don't bury the lead in disclaimers.</li>\n</ul>\n<p>Step 3: Create a \"sounds like / doesn't sound like\" reference:</p>\n<ul>\n<li>Sounds like: \"Here's what actually works.\"</li>\n<li>Doesn't sound like: \"In our humble opinion, you might want to consider...\"</li>\n</ul>\n<p>Step 4: Build a vocabulary list:</p>\n<ul>\n<li>Words we use: build, launch, scale, ship, test, learn</li>\n<li>Words we avoid: synergy, leverage, circle back, touch base</li>\n</ul>\n<p>Step 5: Create platform-specific voice guidelines:</p>\n<ul>\n<li>LinkedIn: More polished, thought-leadership tone</li>\n<li>TikTok: More casual, energetic, trend-aware</li>\n<li>Instagram: Visual-first, aspirational but relatable</li>\n<li>Email: Conversational, personal, value-dense</li>\n</ul>\n<p><strong>Messaging hierarchy:</strong></p>\n<ol>\n<li>Brand promise (one sentence: what you deliver)</li>\n<li>Positioning statement (who you serve, what makes you different)</li>\n<li>Key messages (3-5 pillars of your content strategy)</li>\n<li>Proof points (data, testimonials, case studies for each pillar)</li>\n<li>Call-to-action library (different CTAs for different funnel stages)</li>\n</ol>\n<hr />", "words": 1555}}, {"id": "volume-04", "title": "Volume IV: AI TOOLS + AUTOMATION", "lessons": [], "single": {"title": "Volume IV: AI TOOLS + AUTOMATION", "html": "<h1>Volume IV: AI TOOLS + AUTOMATION</h1>\n<table>\n<thead>\n<tr>\n<th>Tool</th>\n<th>Category</th>\n<th>Website</th>\n<th>Best for</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ChatGPT</td>\n<td>Writing/strategy</td>\n<td><a href=\"https://chatgpt.com\">chatgpt.com</a></td>\n<td>Brainstorming, drafting, analysis</td>\n</tr>\n<tr>\n<td>Claude</td>\n<td>Writing/analysis</td>\n<td><a href=\"https://claude.ai\">claude.ai</a></td>\n<td>Long-form strategy, deep reasoning</td>\n</tr>\n<tr>\n<td>Canva</td>\n<td>Design</td>\n<td><a href=\"https://www.canva.com\">canva.com</a></td>\n<td>Visual assets, brand kits</td>\n</tr>\n<tr>\n<td>Buffer</td>\n<td>Scheduling</td>\n<td><a href=\"https://buffer.com\">buffer.com</a></td>\n<td>Simple publishing, small teams</td>\n</tr>\n<tr>\n<td>Hootsuite</td>\n<td>Enterprise management</td>\n<td><a href=\"https://www.hootsuite.com\">hootsuite.com</a></td>\n<td>Full-suite social management</td>\n</tr>\n<tr>\n<td>Later</td>\n<td>Visual planning</td>\n<td><a href=\"https://later.com\">later.com</a></td>\n<td>Creator workflows, Instagram</td>\n</tr>\n<tr>\n<td>Sprout Social</td>\n<td>Reporting/inbox</td>\n<td><a href=\"https://sproutsocial.com\">sproutsocial.com</a></td>\n<td>Enterprise analytics</td>\n</tr>\n<tr>\n<td>Descript</td>\n<td>Video editing</td>\n<td><a href=\"https://www.descript.com\">descript.com</a></td>\n<td>Text-based video editing</td>\n</tr>\n<tr>\n<td>Opus Clip</td>\n<td>Video repurposing</td>\n<td><a href=\"https://www.opus.pro\">opus.pro</a></td>\n<td>Auto-clip long videos</td>\n</tr>\n<tr>\n<td>Midjourney</td>\n<td>Image generation</td>\n<td><a href=\"https://www.midjourney.com\">midjourney.com</a></td>\n<td>High-quality marketing visuals</td>\n</tr>\n<tr>\n<td>Zapier</td>\n<td>Automation</td>\n<td><a href=\"https://zapier.com\">zapier.com</a></td>\n<td>No-code workflow connections</td>\n</tr>\n<tr>\n<td>Make</td>\n<td>Automation</td>\n<td><a href=\"https://www.make.com\">make.com</a></td>\n<td>Visual automation builder</td>\n</tr>\n<tr>\n<td>Metricool</td>\n<td>Scheduling + analytics</td>\n<td><a href=\"https://metricool.com\">metricool.com</a></td>\n<td>Cross-channel planning</td>\n</tr>\n<tr>\n<td>Brandwatch</td>\n<td>Listening</td>\n<td><a href=\"https://www.brandwatch.com\">brandwatch.com</a></td>\n<td>Enterprise social listening</td>\n</tr>\n<tr>\n<td>Looker Studio</td>\n<td>Reporting</td>\n<td><a href=\"https://lookerstudio.google.com\">lookerstudio.google.com</a></td>\n<td>Custom dashboards</td>\n</tr>\n</tbody>\n</table>\n<h3>Chapter 1: AI-Assisted Content Creation</h3>\n<p><strong>Prompt engineering for social media:</strong></p>\n<p><strong>The CRAFT Prompt Framework:</strong></p>\n<ul>\n<li>Context: Give the AI role, brand voice, and audience information</li>\n<li>Request: State exactly what you need (format, length, tone)</li>\n<li>Audience: Define who will read/watch this</li>\n<li>Format: Specify structure (bullet points, script, caption, thread)</li>\n<li>Tone: Reference voice guidelines or example content</li>\n</ul>\n<p><strong>Example prompt (caption writing):</strong><br />\n\"You are a social media strategist for [Brand], a B2B SaaS company targeting marketing directors. Write 3 Instagram carousel caption options for a post about email segmentation. Tone: confident, practical, slightly irreverent. Format: Hook line, 3-4 body sentences, CTA. Include relevant hashtags (5-8). Character limit: 2,200.\"</p>\n<p><strong>Example prompt (content ideation):</strong><br />\n\"Generate 20 TikTok video ideas for a recruiting agency targeting Gen Z job seekers. Each idea should include: hook (first 2 seconds), core message, format type (talking head / skit / trend / tutorial), and estimated production difficulty (low/medium/high). Focus on topics that challenge conventional career advice.\"</p>\n<p><strong>Example prompt (repurposing):</strong><br />\n\"Here is the transcript of a 45-minute webinar about LinkedIn lead generation. Extract: (1) The 5 most quotable one-liners, (2) A 150-word LinkedIn post summarizing the key framework, (3) 3 short-form video scripts under 60 seconds each, (4) A 10-slide carousel outline. Match the speaker's conversational tone.\"</p>\n<p><strong>AI content workflow (human-in-the-loop):</strong></p>\n<ol>\n<li>Human defines strategy, topic, angle, audience</li>\n<li>AI generates first draft / options / variations</li>\n<li>Human reviews for accuracy, brand voice, originality</li>\n<li>Human edits, adds personal stories, refines nuance</li>\n<li>Human approves final version</li>\n<li>AI can assist with scheduling, hashtag research, analytics</li>\n</ol>\n<p><strong>What AI does well:</strong> Brainstorming volume, drafting speed, research summaries, data analysis, caption variations, hashtag research, trend identification, scheduling optimization, A/B test suggestions.</p>\n<p><strong>What AI does poorly:</strong> Original creative vision, authentic personal stories, real-time cultural sensitivity, brand-specific humor, relationship building, crisis judgment, ethical edge cases, visual aesthetics (without human direction).</p>\n<h3>Chapter 2: Automation Workflows</h3>\n<p><strong>Workflow 1: Content Publishing Pipeline</strong><br />\nTrigger: Content approved in project management tool<br />\n\u2192 Auto-format for each platform (Zapier/Make)<br />\n\u2192 Push to scheduling tool (Buffer/Later/Hootsuite)<br />\n\u2192 Notify team in Slack/ClickUp Chat<br />\n\u2192 Track publish status in dashboard</p>\n<p><strong>Workflow 2: Engagement Monitoring</strong><br />\nTrigger: New comment/mention detected<br />\n\u2192 Sentiment analysis (positive/negative/neutral)<br />\n\u2192 Route to appropriate responder<br />\n\u2192 If negative: flag for priority response<br />\n\u2192 If positive: queue for reshare consideration<br />\n\u2192 Log all interactions in CRM</p>\n<p><strong>Workflow 3: Lead Capture from Social</strong><br />\nTrigger: User clicks link in bio / DMs keyword<br />\n\u2192 Auto-respond with value offer<br />\n\u2192 Capture contact info in form<br />\n\u2192 Add to email sequence<br />\n\u2192 Tag lead source as social channel<br />\n\u2192 Notify sales team if high-intent signal</p>\n<p><strong>Workflow 4: Reporting Automation</strong><br />\nTrigger: Weekly/monthly schedule<br />\n\u2192 Pull metrics from all platforms via API<br />\n\u2192 Aggregate in Looker Studio / Google Sheets<br />\n\u2192 Calculate period-over-period changes<br />\n\u2192 Generate summary narrative (AI-assisted)<br />\n\u2192 Send to stakeholders via email/Slack</p>\n<p><strong>Workflow 5: Content Repurposing Pipeline</strong><br />\nTrigger: New YouTube video published<br />\n\u2192 Auto-transcribe (Descript API)<br />\n\u2192 AI extracts top quotes and key moments<br />\n\u2192 Generate short-form clip timestamps<br />\n\u2192 Create draft carousels and captions<br />\n\u2192 Queue for human review and editing<br />\n\u2192 Schedule repurposed content across platforms</p>\n<p><strong>Automation rules:</strong></p>\n<ul>\n<li>Never automate without human QA checkpoint</li>\n<li>Test every automation with 5 manual runs first</li>\n<li>Build error handling (what happens when it breaks?)</li>\n<li>Document every workflow (so someone else can maintain it)</li>\n<li>Review automations quarterly (platforms change, workflows break)</li>\n</ul>\n<h3>Chapter 3: Tool Stack Selection</h3>\n<p><strong>Decision framework for choosing tools:</strong></p>\n<ol>\n<li>What problem does this solve? (Be specific)</li>\n<li>What's the team size and skill level?</li>\n<li>What's the budget constraint?</li>\n<li>What integrations are required?</li>\n<li>What's the learning curve vs. time saved?</li>\n<li>Is there a free tier that covers the need?</li>\n</ol>\n<p><strong>Recommended stacks by team size:</strong></p>\n<p>Solo creator: Canva (design) + CapCut (video) + Buffer (scheduling) + ChatGPT (writing) + Google Sheets (tracking)</p>\n<p>Small team (2-5): Canva Pro + Descript + Later/Buffer + Claude/ChatGPT + Notion or ClickUp + Metricool</p>\n<p>Agency/Enterprise (5+): Hootsuite or Sprout Social + Adobe Creative Suite + Descript + Make/Zapier + Looker Studio + Brandwatch + ClickUp</p>\n<h3>Chapter 4: AI Governance and Ethics</h3>\n<p><strong>AI governance:</strong> Every AI-assisted output needs human QA for accuracy, brand fit, originality, clarity, legal risk, and tone.</p>\n<p><strong>The AI Content Ethics Checklist:</strong></p>\n<ol>\n<li>Is this factually accurate? (AI hallucinates, always verify claims and statistics)</li>\n<li>Does this sound like our brand? (Not generic AI voice)</li>\n<li>Is this original enough? (Not a rehash of training data)</li>\n<li>Could this be harmful or offensive to any audience segment?</li>\n<li>Are we transparent about AI use where required? (Platform policies vary)</li>\n<li>Does this respect intellectual property? (No copied structures from competitors)</li>\n<li>Is the human judgment layer documented? (Who reviewed, when, what changed)</li>\n</ol>\n<p><strong>Disclosure guidelines:</strong></p>\n<ul>\n<li>FTC requires disclosure when AI generates endorsements or testimonials</li>\n<li>Some platforms require AI-generated content labels</li>\n<li>Internal policy: disclose AI assistance in process docs, not necessarily in published content (unless legally required)</li>\n<li>Never use AI to impersonate real people without explicit consent</li>\n</ul>\n<p><strong>AI training data hygiene:</strong></p>\n<ul>\n<li>Never input client confidential data into public AI tools</li>\n<li>Use enterprise tiers with data privacy agreements</li>\n<li>Don't train custom models on data you don't own</li>\n<li>Regularly audit what data flows into which AI tools</li>\n<li>Maintain a registry of AI tools and their data policies</li>\n</ul>\n<hr />", "words": 1089}}, {"id": "volume-05", "title": "Volume V: PAID ADVERTISING", "lessons": [], "single": {"title": "Volume V: PAID ADVERTISING", "html": "<h1>Volume V: PAID ADVERTISING</h1>\n<h3>Chapter 1: Funnel Architecture</h3>\n<p><strong>Funnel architecture:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Stage</th>\n<th>Objective</th>\n<th>Formats</th>\n<th>Primary KPI</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Top</td>\n<td>Attention + discovery</td>\n<td>Short video, UGC-style, native</td>\n<td>CPM, thumbstop, CTR</td>\n</tr>\n<tr>\n<td>Middle</td>\n<td>Trust + consideration</td>\n<td>Case study, explainer, testimonial</td>\n<td>LPV, watch time, CPC</td>\n</tr>\n<tr>\n<td>Bottom</td>\n<td>Conversion</td>\n<td>Offer-driven, product demo, retargeting</td>\n<td>CPA, ROAS, CVR</td>\n</tr>\n<tr>\n<td>Post-purchase</td>\n<td>LTV + advocacy</td>\n<td>Upsell, referral, review ask</td>\n<td>Repeat purchase, referral</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Full-funnel budget allocation (general guide):</strong></p>\n<ul>\n<li>Top of funnel: 40-50% (driving new audience in)</li>\n<li>Middle of funnel: 20-30% (warming and educating)</li>\n<li>Bottom of funnel: 20-30% (converting warm audiences)</li>\n<li>Post-purchase: 5-10% (retention and upsell)</li>\n</ul>\n<p>Adjust based on business maturity: new brands need more top-of-funnel; established brands with large audiences can shift more to bottom.</p>\n<h3>Chapter 2: Meta Ads (Facebook + Instagram)</h3>\n<p><strong>Meta Ads:</strong> Creative matters more than targeting in 2026 (Advantage+ handles targeting). Test hooks, angles, offers, visuals.</p>\n<p><strong>Campaign structure (simplified for 2026):</strong></p>\n<ul>\n<li>Advantage+ Shopping Campaigns (ASC): Best for e-commerce. Let Meta's AI find buyers.</li>\n<li>Advantage+ App Campaigns: Mobile app installs.</li>\n<li>Manual campaigns: Use when you need granular control (specific audiences, placements, or creative testing).</li>\n</ul>\n<p><strong>Creative testing framework:</strong></p>\n<ol>\n<li>Start with 3-5 creative concepts (different hooks/angles)</li>\n<li>Each concept gets 2-3 variations (different visuals, different openings)</li>\n<li>Run for 3-5 days minimum with sufficient budget ($20-50/day per ad)</li>\n<li>Kill underperformers at 2x target CPA</li>\n<li>Scale winners by duplicating into new ad sets or increasing budget 20% per day</li>\n<li>Refresh creative every 2-4 weeks (fatigue is real)</li>\n</ol>\n<p><strong>Ad creative best practices:</strong></p>\n<ul>\n<li>First 3 seconds must stop the scroll (movement, text, face, surprise)</li>\n<li>Native format: look like organic content, not ads</li>\n<li>UGC-style outperforms polished studio content for most brands</li>\n<li>Show the product in use within first 5 seconds</li>\n<li>One clear CTA (don't confuse with multiple asks)</li>\n<li>Test vertical video (9:16) as primary format</li>\n</ul>\n<p><strong>Audience strategy:</strong></p>\n<ul>\n<li>Broad targeting (let Advantage+ find your audience through creative signals)</li>\n<li>Lookalike audiences from high-value customers (purchase, high LTV)</li>\n<li>Retargeting: website visitors (7, 14, 30 day windows), video viewers (25%, 50%, 75%), engagers</li>\n<li>Exclusions: existing customers (unless upselling), recent purchasers, employees</li>\n</ul>\n<p><strong>Pixel and Conversions API setup:</strong></p>\n<ul>\n<li>Install Meta Pixel on all pages</li>\n<li>Set up Conversions API (server-side) for accurate tracking post-iOS 14+</li>\n<li>Configure standard events: ViewContent, AddToCart, InitiateCheckout, Purchase</li>\n<li>Set up custom conversions for non-standard goals</li>\n<li>Verify domain and prioritize events in Events Manager</li>\n</ul>\n<p><strong>Budgeting and bidding:</strong></p>\n<ul>\n<li>Daily budget: Use for testing (easier to control spend)</li>\n<li>Lifetime budget: Use for campaigns with fixed end dates</li>\n<li>Cost cap: Set maximum acceptable CPA</li>\n<li>Bid cap: Set maximum bid per auction (advanced)</li>\n<li>Minimum ROAS: Set for e-commerce when you know your margins</li>\n<li>Learning phase: Need 50 conversions per week per ad set to exit</li>\n</ul>\n<h3>Chapter 3: TikTok Ads</h3>\n<p><strong>TikTok Ads operating principles:</strong></p>\n<ul>\n<li>The platform rewards content that feels native, not ads that feel corporate</li>\n<li>Sound-on is default (unlike other platforms)</li>\n<li>Creative diversity matters: test many angles quickly</li>\n<li>Spark Ads (boosting organic posts) often outperform traditional ads</li>\n</ul>\n<p><strong>Campaign objectives:</strong></p>\n<ul>\n<li>Reach: Brand awareness at scale</li>\n<li>Traffic: Website visits</li>\n<li>Video views: Engagement and warming</li>\n<li>Lead generation: In-app forms (no landing page needed)</li>\n<li>Conversions: Website actions (requires pixel)</li>\n<li>App installs: Mobile downloads</li>\n</ul>\n<p><strong>TikTok creative formula for ads:</strong></p>\n<ol>\n<li>Hook (0-3s): Native-feeling opening that doesn't scream \"ad\"</li>\n<li>Problem/pain (3-8s): Relatable frustration</li>\n<li>Solution reveal (8-15s): Your product/service as the answer</li>\n<li>Social proof (15-20s): Quick testimonial, result, or review</li>\n<li>CTA (final 3-5s): Clear, specific next step</li>\n</ol>\n<p><strong>Spark Ads strategy:</strong></p>\n<ul>\n<li>Find organic posts that already perform well</li>\n<li>Boost them with paid spend to wider audiences</li>\n<li>Maintains all organic engagement (likes, comments, shares)</li>\n<li>Feels more authentic than traditional ads</li>\n<li>Can use creator posts (with authorization code)</li>\n</ul>\n<p><strong>TikTok pixel setup:</strong></p>\n<ul>\n<li>Install base pixel code on website</li>\n<li>Set up events: ViewContent, AddToCart, CompletePayment, SubmitForm</li>\n<li>Use Advanced Matching for better attribution</li>\n<li>Configure Events API for server-side tracking (similar to Meta CAPI)</li>\n</ul>\n<h3>Chapter 4: LinkedIn Ads</h3>\n<p><strong>When LinkedIn Ads make sense:</strong></p>\n<ul>\n<li>High-value B2B products/services ($1,000+ deal size)</li>\n<li>Professional audience targeting (by job title, company, seniority, industry)</li>\n<li>Account-based marketing (targeting specific companies)</li>\n<li>Recruitment and employer branding</li>\n</ul>\n<p><strong>Why LinkedIn Ads are expensive (and when it's worth it):</strong></p>\n<ul>\n<li>Average CPC: $5-12 (vs. $1-3 on Meta)</li>\n<li>But: conversion quality is significantly higher for B2B</li>\n<li>One enterprise deal can justify thousands in LinkedIn spend</li>\n<li>Best for high-ticket, long-sales-cycle businesses</li>\n</ul>\n<p><strong>Campaign types:</strong></p>\n<ul>\n<li>Sponsored Content: Native feed posts (single image, video, carousel, document)</li>\n<li>Message Ads: Direct InMail (use sparingly, can feel intrusive)</li>\n<li>Lead Gen Forms: In-platform forms pre-filled with profile data (high conversion rates)</li>\n<li>Text Ads: Sidebar/top bar (cheap, low CTR, good for awareness)</li>\n<li>Dynamic Ads: Personalized with user's profile photo (follower ads, spotlight ads)</li>\n</ul>\n<p><strong>Targeting capabilities:</strong></p>\n<ul>\n<li>Job title, function, seniority level</li>\n<li>Company name, size, industry, growth rate</li>\n<li>Skills, groups, interests</li>\n<li>Education (school, degree, field of study)</li>\n<li>Demographics (age, gender, location)</li>\n<li>Matched audiences (website retargeting, contact lists, lookalikes)</li>\n<li>Account lists (upload target company list for ABM)</li>\n</ul>\n<p><strong>LinkedIn Ads creative best practices:</strong></p>\n<ul>\n<li>Professional but not corporate (humans connect with humans)</li>\n<li>Lead with insight or data (LinkedIn audience values substance)</li>\n<li>Video: 30-90 seconds, captions required, hook with a surprising stat</li>\n<li>Carousel/Document: Educational frameworks, step-by-step guides</li>\n<li>Single image: Clean, minimal text, clear value proposition</li>\n<li>Always test organic first, then boost winners</li>\n</ul>\n<h3>Chapter 5: YouTube Ads</h3>\n<p><strong>YouTube ad formats:</strong></p>\n<ul>\n<li>Skippable in-stream (skip after 5s): Most common, pay only if watched 30s+ or clicked</li>\n<li>Non-skippable in-stream (15-20s): Force full view, higher CPM</li>\n<li>Bumper ads (6s): Awareness, frequency, brand recall</li>\n<li>In-feed (discovery): Appears in search/suggestions, pay per click</li>\n<li>Shorts ads: Vertical, appears between Shorts content</li>\n</ul>\n<p><strong>YouTube Ads creative principles:</strong></p>\n<ul>\n<li>First 5 seconds must earn the next 25 (hook or lose them at skip)</li>\n<li>Direct response: Lead with problem, show solution, clear CTA</li>\n<li>Brand awareness: Story-driven, emotional, memorable</li>\n<li>Retargeting: Remind them of what they viewed, offer incentive</li>\n</ul>\n<p><strong>Audience targeting on YouTube:</strong></p>\n<ul>\n<li>Custom intent: People searching specific keywords on Google</li>\n<li>In-market: People actively researching products in your category</li>\n<li>Affinity: People with demonstrated long-term interests</li>\n<li>Remarketing: Your website visitors, video viewers, channel subscribers</li>\n<li>Customer match: Upload email lists for targeting or lookalikes</li>\n<li>Placement targeting: Specific channels or videos</li>\n</ul>\n<p><strong>YouTube Ads measurement:</strong></p>\n<ul>\n<li>View rate: % who watch past 30s (benchmark: 15-30%)</li>\n<li>CTR: Click-through rate to website (benchmark: 0.5-2%)</li>\n<li>Cost per view (CPV): What you pay per qualified view (benchmark: $0.02-0.10)</li>\n<li>View-through conversions: People who saw the ad but converted later</li>\n<li>Brand lift: Survey-based measurement of awareness/consideration change</li>\n</ul>\n<h3>Chapter 6: Paid Ads Operations</h3>\n<p><strong>Testing cadence:</strong></p>\n<ul>\n<li>Week 1-2: Launch 3-5 concepts, gather data</li>\n<li>Week 2-3: Kill losers, iterate on winners, test new hooks</li>\n<li>Week 3-4: Scale proven winners, introduce fresh concepts</li>\n<li>Monthly: Review performance, adjust budget allocation, refresh creative</li>\n</ul>\n<p><strong>Budget scaling rules:</strong></p>\n<ul>\n<li>Never increase budget more than 20-30% per day (avoids resetting learning)</li>\n<li>Duplicate winning ad sets rather than just increasing budget</li>\n<li>When CPA rises 30%+ above target for 3 days, pause and diagnose</li>\n<li>Creative fatigue is the #1 cause of performance decline</li>\n</ul>\n<p><strong>Attribution and tracking:</strong></p>\n<ul>\n<li>Use UTM parameters on all ad links (source, medium, campaign, content, term)</li>\n<li>Set up Google Analytics 4 with proper conversion tracking</li>\n<li>Compare platform-reported conversions vs. GA4 (they'll differ)</li>\n<li>Use post-purchase surveys (\"How did you hear about us?\") for qualitative data</li>\n<li>Accept that attribution is imperfect: directional, not exact</li>\n</ul>\n<p><strong>Reporting for clients/stakeholders:</strong></p>\n<ul>\n<li>Lead with business outcomes (revenue, leads, pipeline) not vanity metrics</li>\n<li>Show cost efficiency trends (CPA, ROAS over time)</li>\n<li>Highlight winning creative and explain why it worked</li>\n<li>Present clear recommendations for next period</li>\n<li>Be honest about what didn't work and what you'll change</li>\n</ul>\n<hr />", "words": 1361}}, {"id": "volume-06", "title": "Volume VI: ENTERPRISE OPERATIONS", "lessons": [], "single": {"title": "Volume VI: ENTERPRISE OPERATIONS", "html": "<h1>Volume VI: ENTERPRISE OPERATIONS</h1>\n<h3>Chapter 1: Content Operations System</h3>\n<p><strong>Core workflows:</strong></p>\n<p><strong>Workflow 1: Content Intake</strong><br />\nEvery piece of content starts with a structured request:</p>\n<ul>\n<li>Requester: Who is asking for this content?</li>\n<li>Business goal: What outcome does this serve? (leads, awareness, retention, recruitment)</li>\n<li>Target audience: Who specifically is this for?</li>\n<li>Key message: What one thing must the audience take away?</li>\n<li>Deadline: When must this be live? (Include review buffer)</li>\n<li>Owner: Who is responsible for execution?</li>\n<li>Assets needed: What exists already? What must be created?</li>\n<li>Approval path: Who signs off before publish?</li>\n</ul>\n<p><strong>Workflow 2: Editorial Planning</strong></p>\n<ul>\n<li>Monthly planning session: Review performance, set themes, allocate resources</li>\n<li>Content calendar: Map content to dates, platforms, campaigns, and team members</li>\n<li>Theme blocks: Group content around monthly/weekly themes for coherence</li>\n<li>Format mix: Balance video, static, carousel, stories, text posts</li>\n<li>Campaign integration: Align organic content with paid campaigns and product launches</li>\n<li>Buffer slots: Leave 20% of calendar open for reactive/trending content</li>\n</ul>\n<p><strong>Workflow 3: Creative Production</strong></p>\n<ol>\n<li>Brief creation: Fill standard creative brief template</li>\n<li>Script/copy draft: Writer produces first draft</li>\n<li>Internal review: Strategist reviews for alignment with goals</li>\n<li>Visual production: Designer/videographer creates assets</li>\n<li>QA check: Proofread, link check, tag check, accessibility check</li>\n<li>Revision round: Max 2 revision rounds (scope creep prevention)</li>\n<li>Final approval: Designated approver signs off</li>\n<li>Schedule: Content loaded into publishing tool with correct date/time</li>\n</ol>\n<p><strong>Workflow 4: Approval System</strong></p>\n<ul>\n<li>Tier 1 (standard content): Team lead approves within 24 hours</li>\n<li>Tier 2 (campaign content): Marketing manager approves within 48 hours</li>\n<li>Tier 3 (sensitive/legal): Director + legal review within 72 hours</li>\n<li>Escalation rule: If approver misses SLA, auto-escalates to their manager</li>\n<li>Emergency publish: Designated person can approve without full chain (documented)</li>\n</ul>\n<p><strong>Workflow 5: Publishing QA</strong><br />\nBefore any content goes live, verify:</p>\n<ul>\n<li>Caption: Spelling, grammar, tone, hashtags, mentions</li>\n<li>Links: Click every link, confirm it works and tracks correctly</li>\n<li>Tags: People, locations, products tagged correctly</li>\n<li>Accessibility: Alt text on images, captions on video</li>\n<li>Tracking: UTM parameters, pixel events firing</li>\n<li>Timing: Scheduled for optimal time, not conflicting with other posts</li>\n<li>Platform specs: Correct dimensions, file size, format</li>\n</ul>\n<p><strong>Workflow 6: Community Management</strong></p>\n<ul>\n<li>Response SLA: Reply within 2 hours during business hours</li>\n<li>Tone guide: How to respond to positive, negative, neutral, spam</li>\n<li>Escalation triggers: When to involve management (legal threats, PR risk, safety)</li>\n<li>Proactive engagement: Comment on relevant posts, engage with industry peers</li>\n<li>DM protocol: How to handle inquiries, lead routing, FAQ responses</li>\n<li>Moderation rules: What to hide, delete, or report</li>\n</ul>\n<p><strong>Workflow 7: Crisis Escalation</strong></p>\n<ul>\n<li>Level 1 (minor): Negative comment, minor complaint \u2192 Community manager responds</li>\n<li>Level 2 (moderate): Multiple complaints, minor PR issue \u2192 Team lead + comms review</li>\n<li>Level 3 (major): Viral backlash, factual error, offensive content \u2192 Director + legal + PR</li>\n<li>Level 4 (critical): Company-wide reputational threat \u2192 C-suite war room</li>\n</ul>\n<p>Crisis response protocol:</p>\n<ol>\n<li>Pause all scheduled content immediately</li>\n<li>Assess: What happened? What's the scope? What's the sentiment?</li>\n<li>Document: Screenshot everything, record timeline</li>\n<li>Draft response: Clear, empathetic, factual (no defensiveness)</li>\n<li>Approve response: Appropriate level signs off</li>\n<li>Publish: Single, clear statement on relevant platforms</li>\n<li>Monitor: Track sentiment shift, respond to follow-ups</li>\n<li>Debrief: What went wrong? What do we change?</li>\n</ol>\n<h3>Chapter 2: Standard Operating Procedures</h3>\n<p><strong>SOP 1: Client Onboarding</strong></p>\n<p>Purpose: Ensure consistent, thorough onboarding for every new social media client.</p>\n<p>Steps:</p>\n<ol>\n<li>Kickoff call: Understand business goals, audience, competitors, brand voice, past performance</li>\n<li>Access collection: Request all platform logins, ad accounts, analytics access, brand assets</li>\n<li>Audit: Review current profiles, content performance, audience demographics, competitor landscape</li>\n<li>Strategy document: Create 90-day strategy with goals, KPIs, content pillars, posting cadence</li>\n<li>Content calendar: Build first month's calendar for client review</li>\n<li>Approval workflow: Agree on review process, turnaround times, feedback format</li>\n<li>Tool setup: Configure scheduling, reporting, and collaboration tools</li>\n<li>Team introduction: Client meets their full team (strategist, creator, community manager)</li>\n<li>First content batch: Produce and get approval on first week of content</li>\n<li>30-day check-in: Review early performance, adjust strategy as needed</li>\n</ol>\n<p><strong>SOP 2: Brand Voice Documentation</strong></p>\n<p>Purpose: Codify brand voice so any team member can write on-brand content.</p>\n<p>Deliverables:</p>\n<ul>\n<li>Voice attributes (3-5 adjectives with definitions and anti-examples)</li>\n<li>Tone spectrum (how voice shifts across platforms and content types)</li>\n<li>Vocabulary list (words we use, words we never use)</li>\n<li>Grammar and style preferences (Oxford comma? Emoji use? Capitalization?)</li>\n<li>Example library (10+ on-brand examples, 5+ off-brand examples)</li>\n<li>Platform-specific guidelines (how voice adapts to each channel)</li>\n</ul>\n<p><strong>SOP 3: Publishing Protocol</strong></p>\n<p>Purpose: Zero errors in published content.</p>\n<p>Pre-publish checklist:</p>\n<ul>\n<li>[ ] Copy proofread by someone other than the writer</li>\n<li>[ ] All links tested and working</li>\n<li>[ ] UTM tracking parameters added</li>\n<li>[ ] Images/video in correct dimensions for platform</li>\n<li>[ ] Alt text added to all images</li>\n<li>[ ] Captions/subtitles added to all video</li>\n<li>[ ] Hashtags researched and relevant (not banned)</li>\n<li>[ ] Tags/mentions verified as correct accounts</li>\n<li>[ ] Scheduled for approved time slot</li>\n<li>[ ] No conflicts with other campaigns or sensitive dates</li>\n</ul>\n<hr />", "words": 875}}]}}, "shared": {"standards_framework": {"title": "Training Standards Compliance Framework", "html": "<h1>Training Standards Compliance Framework</h1>\n<p><strong>Document ID:</strong> HTA-TSCF-001 | <strong>Version:</strong> 1.0 | <strong>Effective Date:</strong> July 30, 2026<br />\n<strong>Owner:</strong> Operations / L&amp;D | <strong>Classification:</strong> Internal Standard<br />\n<strong>Parent Document:</strong> Hyre Training Academy</p>\n<hr />\n<h2>1. PURPOSE</h2>\n<p>This is the quality gate. Every module, every volume, every chapter in the Hyre Training Academy must meet these 7 standards before going live. Not \"should meet.\" Must meet. No exceptions, no grandfathering, no \"we'll fix it in the next pass.\"</p>\n<p>These standards are derived from ISO 10015:2019, ADDIE methodology, Kirkpatrick evaluation model, 70-20-10 learning framework, Universal Design for Learning (UDL), and WCAG 2.1 accessibility guidelines. The bar is high because the output matters: people's careers depend on what we teach them here.</p>\n<hr />\n<h2>2. MANDATORY STANDARDS (7 REQUIREMENTS)</h2>\n<h3>Standard 1: Explicit Learning Objectives Per Chapter</h3>\n<p><strong>Source:</strong> ADDIE Design Phase, ISO 10015:2019 Section 7.3</p>\n<p><strong>Requirement:</strong> Every chapter must open with 3-5 measurable learning objectives using Bloom's Taxonomy action verbs.</p>\n<p><strong>Format:</strong></p>\n<blockquote>\n<p>\"By the end of this chapter, the learner will be able to:\"<br />\n[Action verb] + [specific skill/knowledge] + [context/condition]<br />\n[Action verb] + [specific skill/knowledge] + [context/condition]<br />\n[Action verb] + [specific skill/knowledge] + [context/condition]<br />\n<strong>Bloom's Taxonomy Verb Bank:</strong></p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>Level</th>\n<th>Verbs</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Remember</td>\n<td>Define, list, identify, recall, name, state</td>\n</tr>\n<tr>\n<td>Understand</td>\n<td>Explain, describe, summarize, interpret, classify</td>\n</tr>\n<tr>\n<td>Apply</td>\n<td>Execute, implement, demonstrate, use, solve</td>\n</tr>\n<tr>\n<td>Analyze</td>\n<td>Compare, differentiate, diagnose, deconstruct, examine</td>\n</tr>\n<tr>\n<td>Evaluate</td>\n<td>Assess, judge, critique, justify, recommend</td>\n</tr>\n<tr>\n<td>Create</td>\n<td>Design, build, construct, produce, formulate</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Compliance check:</strong> If a learning objective cannot be measured through the chapter's quiz or exercise, it must be rewritten.</p>\n<hr />\n<h3>Standard 2: Pre-Assessment / Baseline Diagnostic</h3>\n<p><strong>Source:</strong> ISO 10015:2019 Training Needs Analysis, ADDIE Analysis Phase</p>\n<p><strong>Requirement:</strong> Every module must include an entry diagnostic assessment before Volume I begins.</p>\n<p><strong>Diagnostic structure:</strong></p>\n<ul>\n<li>15-25 questions covering all volumes at surface level</li>\n<li>Mix of multiple choice, scenario judgment, and short application</li>\n<li>Auto-scored with competency heatmap output</li>\n<li>Results categorize learner as: Beginner (0-40%), Intermediate (41-70%), Advanced (71-90%), Expert (91-100%)</li>\n<li>Recommended learning path generated based on score</li>\n</ul>\n<p><strong>Design rules:</strong></p>\n<ul>\n<li>Questions must map directly to volume-level competencies</li>\n<li>No trick questions or obscure trivia</li>\n<li>Must be completable in under 15 minutes</li>\n<li>Results are private to the learner unless shared with manager</li>\n</ul>\n<hr />\n<h3>Standard 3: Prerequisites Clearly Stated</h3>\n<p><strong>Source:</strong> ADDIE Design Phase, ISO 10015 Competence Sequencing</p>\n<p><strong>Requirement:</strong> Every module and every volume must declare prerequisites explicitly.</p>\n<p><strong>Format (Module Level):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Prerequisite Type</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Required Prior Modules</td>\n<td>Which HTA modules must be completed first</td>\n</tr>\n<tr>\n<td>Required Tool Access</td>\n<td>Which platforms/tools the learner needs active access to</td>\n</tr>\n<tr>\n<td>Required Knowledge</td>\n<td>Baseline knowledge assumed (not taught in this module)</td>\n</tr>\n<tr>\n<td>Recommended Experience</td>\n<td>Ideal prior work experience for maximum benefit</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Format (Volume Level):</strong></p>\n<ul>\n<li>\"Before starting this volume, you must have completed: [Volume X]\" OR \"This volume can be taken independently.\"</li>\n</ul>\n<p><strong>Rule:</strong> If a volume has no prerequisites, state \"None. This volume is self-contained.\" Never leave the field blank.</p>\n<hr />\n<h3>Standard 4: Estimated Completion Time Per Chapter</h3>\n<p><strong>Source:</strong> SCORM/xAPI standard, ISO 10015 Resource Planning</p>\n<p><strong>Requirement:</strong> Every chapter and volume must display estimated completion time.</p>\n<p><strong>Time estimation method:</strong></p>\n<ul>\n<li>Reading: 200 words per minute average</li>\n<li>Exercises: estimated active completion time</li>\n<li>Quizzes: 1.5 minutes per question</li>\n<li>Scenario drills: 5-8 minutes each</li>\n<li>Buffer: add 15% for reflection and note-taking</li>\n</ul>\n<p><strong>Display format:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Volume</th>\n<th>Est. Total Time</th>\n<th>Chapters</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Volume I</td>\n<td>4.5 hours</td>\n<td>Ch1: 35min, Ch2: 40min, Ch3: 45min...</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Rule:</strong> Time estimates must appear in the interactive page header AND in the module's table of contents.</p>\n<hr />\n<h3>Standard 5: Multimedia Variety</h3>\n<p><strong>Source:</strong> Universal Design for Learning (UDL), Multiple Means of Representation</p>\n<p><strong>Requirement:</strong> Every volume must include at least 3 of the following 5 media types:</p>\n<table>\n<thead>\n<tr>\n<th>Media Type</th>\n<th>Purpose</th>\n<th>Minimum Per Volume</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Text (structured prose)</td>\n<td>Core instruction</td>\n<td>Present in all chapters</td>\n</tr>\n<tr>\n<td>Video walkthrough</td>\n<td>Process demonstration, expert explanation</td>\n<td>1 per volume</td>\n</tr>\n<tr>\n<td>Infographic or visual diagram</td>\n<td>Concept mapping, framework visualization</td>\n<td>2 per volume</td>\n</tr>\n<tr>\n<td>Interactive exercise</td>\n<td>Active practice with feedback</td>\n<td>2 per volume (already met)</td>\n</tr>\n<tr>\n<td>Audio explanation or podcast clip</td>\n<td>Auditory learners, mobile learning</td>\n<td>1 per module (optional stretch)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Multimedia integration points:</strong></p>\n<ul>\n<li>Complex processes: video walkthrough</li>\n<li>Frameworks and models: infographic or diagram</li>\n<li>Real-world examples: case study video or audio interview</li>\n<li>Tool demonstrations: screen recording</li>\n<li>Quick reference: downloadable one-pager</li>\n</ul>\n<p><strong>Production standards:</strong></p>\n<ul>\n<li>Videos: 5-12 minutes max, branded intro/outro, captions required</li>\n<li>Infographics: Hyre brand palette, exportable as PDF</li>\n<li>Audio: clear narration, transcript provided</li>\n</ul>\n<hr />\n<h3>Standard 6: Accessibility Compliance (WCAG 2.1 Level AA)</h3>\n<p><strong>Source:</strong> WCAG 2.1, Section 508, Universal Design for Learning</p>\n<p><strong>Requirement:</strong> All training materials must meet WCAG 2.1 Level AA compliance.</p>\n<p><strong>Mandatory checklist:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Requirement</th>\n<th>Standard</th>\n<th>Implementation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Color contrast</td>\n<td>4.5:1 minimum for text</td>\n<td>Validate all text/background combinations</td>\n</tr>\n<tr>\n<td>Keyboard navigation</td>\n<td>All interactive elements reachable via Tab/Enter</td>\n<td>Test all quizzes, drills, navigation without mouse</td>\n</tr>\n<tr>\n<td>Screen reader support</td>\n<td>Semantic HTML, ARIA labels</td>\n<td>Use proper heading hierarchy, label all interactive elements</td>\n</tr>\n<tr>\n<td>Alt text</td>\n<td>All images described</td>\n<td>Meaningful descriptions (not \"image1.png\")</td>\n</tr>\n<tr>\n<td>Focus indicators</td>\n<td>Visible focus state on all interactive elements</td>\n<td>Test with keyboard-only navigation</td>\n</tr>\n<tr>\n<td>Text resizing</td>\n<td>Content readable at 200% zoom</td>\n<td>No horizontal scrolling at 200%</td>\n</tr>\n<tr>\n<td>Captions</td>\n<td>All video/audio content captioned</td>\n<td>Human-reviewed captions (not auto-only)</td>\n</tr>\n<tr>\n<td>Reading level</td>\n<td>Plain language, short sentences</td>\n<td>Target Grade 8-10 reading level for instructions</td>\n</tr>\n<tr>\n<td>Motion</td>\n<td>No auto-playing animations; respect prefers-reduced-motion</td>\n<td>CSS media query implementation</td>\n</tr>\n<tr>\n<td>Error identification</td>\n<td>Form errors clearly described</td>\n<td>Quiz feedback identifies which question and why</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Testing cadence:</strong> Accessibility audit every time a module is created or significantly updated.</p>\n<hr />\n<h3>Standard 7: Competency-to-Module Mapping Matrix</h3>\n<p><strong>Source:</strong> ISO 10015:2019 Section 6, Competence Management</p>\n<p><strong>Requirement:</strong> Every module must include a matrix linking each volume/chapter to specific job competencies from the role's competency framework.</p>\n<p><strong>Matrix format:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Volume</th>\n<th>Chapter</th>\n<th>Job Competency Developed</th>\n<th>Proficiency Target</th>\n<th>Assessment Method</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>I</td>\n<td>Ch1</td>\n<td>[Specific competency from role framework]</td>\n<td>Foundational / Intermediate / Advanced</td>\n<td>Quiz / Exercise / Scenario</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Rules:</strong></p>\n<ul>\n<li>Every chapter must map to at least 1 competency</li>\n<li>Every competency in the role framework must be addressed by at least 1 chapter</li>\n<li>Proficiency targets must align with the role's required level</li>\n<li>Gaps between competency requirements and training coverage must be flagged for development</li>\n</ul>\n<p><strong>Competency sources:</strong></p>\n<ul>\n<li>Role-specific job descriptions</li>\n<li>Hyre Knowledge Base competency frameworks</li>\n<li>Industry standard competency models (where applicable)</li>\n</ul>\n<hr />\n<h2>3. IMPLEMENTATION TIMELINE</h2>\n<table>\n<thead>\n<tr>\n<th>Phase</th>\n<th>Action</th>\n<th>Deadline</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Phase 1</td>\n<td>Add prerequisites, time estimates, and learning objectives to all existing modules</td>\n<td>August 15, 2026</td>\n</tr>\n<tr>\n<td>Phase 2</td>\n<td>Build pre-assessment diagnostics for all 4 active modules</td>\n<td>August 30, 2026</td>\n</tr>\n<tr>\n<td>Phase 3</td>\n<td>Complete competency-to-module mapping matrices</td>\n<td>September 15, 2026</td>\n</tr>\n<tr>\n<td>Phase 4</td>\n<td>Conduct WCAG 2.1 audit and remediate all interactive pages</td>\n<td>September 30, 2026</td>\n</tr>\n<tr>\n<td>Phase 5</td>\n<td>Integrate multimedia (video/infographic) into priority volumes</td>\n<td>October 31, 2026</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>4. COMPLIANCE VERIFICATION</h2>\n<p><strong>Before any module is marked \"Active\":</strong></p>\n<ul>\n<li>[ ] All 7 standards verified present</li>\n<li>[ ] Pre-assessment tested with sample learner</li>\n<li>[ ] Learning objectives reviewed for measurability</li>\n<li>[ ] Time estimates validated against actual completion</li>\n<li>[ ] Accessibility audit passed</li>\n<li>[ ] Competency matrix cross-referenced with role requirements</li>\n<li>[ ] At least 3 media types present per volume</li>\n</ul>\n<p><strong>Review cadence:</strong> Semi-annual (aligned with Section 24B training curriculum review)</p>\n<hr />\n<h2>5. SOURCE REFERENCES</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Standard</th>\n<th>Application</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>ISO 10015:2019</td>\n<td>Competence management, training needs analysis, evaluation</td>\n</tr>\n<tr>\n<td>2</td>\n<td>ADDIE Model</td>\n<td>Instructional design phases: Analyze, Design, Develop, Implement, Evaluate</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Bloom's Taxonomy (Revised, 2001)</td>\n<td>Learning objective verb classification</td>\n</tr>\n<tr>\n<td>4</td>\n<td>WCAG 2.1 Level AA</td>\n<td>Digital accessibility requirements</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Universal Design for Learning (CAST, 2018)</td>\n<td>Multiple means of representation, engagement, action</td>\n</tr>\n<tr>\n<td>6</td>\n<td>SCORM 2004 / xAPI</td>\n<td>Time tracking, completion standards, learner data portability</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Kirkpatrick Model (2016)</td>\n<td>Training evaluation levels</td>\n</tr>\n<tr>\n<td>8</td>\n<td>70-20-10 Framework</td>\n<td>Learning blend: experience, social, formal</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p><em>Created July 30, 2026. This is a living standard. If a module doesn't comply, it doesn't go live. Period.</em></p>", "words": 1524}, "brand_voice": {"title": "Hyre Brand Voice & Tone Style Guide", "html": "<h1>Hyre Brand Voice &amp; Tone Style Guide</h1>\n<h1>Hyre Brand Voice &amp; Tone Style Guide</h1>\n<p><strong>Version:</strong> 1.0 | <strong>Effective Date:</strong> July 30, 2026 | <strong>Owner:</strong> Operations</p>\n<p>This is how Hyre sounds. Every doc, every module, every training page, every client-facing material. Consistent voice. No exceptions.</p>\n<hr />\n<h2>Voice Identity</h2>\n<p>Hyre sounds like a sharp, experienced operator who respects your time and doesn't waste words. Confident without being arrogant. Direct without being cold. Enterprise-serious without being corporate-stuffy.</p>\n<p>We talk like the best teammate you've ever had: the one who tells you what matters, skips the filler, and makes complex things clear.</p>\n<hr />\n<h2>5 Voice Attributes</h2>\n<table>\n<thead>\n<tr>\n<th>Attribute</th>\n<th>What It Is</th>\n<th>What It Is NOT</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Direct</td>\n<td>Gets to the point in the first sentence. States the take. No throat-clearing.</td>\n<td>Blunt to the point of rudeness. Dismissive. Abrupt without context.</td>\n</tr>\n<tr>\n<td>Opinionated</td>\n<td>Takes a stance. Says what works and what doesn't. Commits to a recommendation.</td>\n<td>Preachy. Condescending. Unable to acknowledge nuance when it matters.</td>\n</tr>\n<tr>\n<td>Practical</td>\n<td>Every sentence earns its place by being useful. Theory exists to serve execution.</td>\n<td>Oversimplified. Dumbed-down. Missing the \"why\" behind the \"how.\"</td>\n</tr>\n<tr>\n<td>Confident</td>\n<td>Speaks with authority. Doesn't hedge with \"maybe\" or \"it depends\" when the answer is clear.</td>\n<td>Boastful. Name-dropping. Self-congratulatory. Selling instead of teaching.</td>\n</tr>\n<tr>\n<td>Warm (under the surface)</td>\n<td>Respects the reader. Cares about their growth. Challenges because it believes in their potential.</td>\n<td>Soft. Overly encouraging. Hand-holding. Participation-trophy energy.</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>Signature Patterns</h2>\n<p>These are the recurring structures that make Hyre content recognizable:</p>\n<p><strong>1. Contrast Framing</strong></p>\n<p>Open with the weak version, then state the strong version.</p>\n<blockquote>\n<p>A weak admin waits for instructions. A strong admin removes friction before anyone notices it existed.<br />\nMost companies get this role wrong. They hire for task support when they should be hiring for leverage.<br />\n<strong>2. Declarative Openings</strong></p>\n</blockquote>\n<p>No \"In this module, you will learn...\" Start with a truth bomb.</p>\n<blockquote>\n<p>Paid advertising is not magic, and it is definitely not just \"boosting posts.\"<br />\nSocial media is not a vibes job. It's a systems job.<br />\nA calendar is not a list of meetings. It's a map of attention, energy, and strategic intent.<br />\n<strong>3. Short Punch After Long Setup</strong></p>\n</blockquote>\n<p>Build context, then land the takeaway in a fragment.</p>\n<blockquote>\n<p>If you skip this and launch anyway, congrats: you're buying confusion.<br />\nBreak one link and the whole thing leaks money.<br />\nThat's the bar.<br />\n<strong>4. The \"Not X. Y.\" Pattern</strong></p>\n</blockquote>\n<p>Reject the common assumption, then state what's true.</p>\n<blockquote>\n<p>This is not basic admin work. This is an operational control tower.<br />\nNot a document. Not a presentation. Not lecture notes.<br />\nThe goal is not a perfect accent. The goal is crystal-clear communication.<br />\n<strong>5. Direct Reader Address</strong></p>\n</blockquote>\n<p>Talk to the reader. Use \"you\" and \"your.\" Make it personal.</p>\n<blockquote>\n<p>Your words mean nothing if people can't understand them.<br />\nIf people cannot trust you with information, they will never trust you with leverage.</p>\n</blockquote>\n<hr />\n<h2>Formatting Rules</h2>\n<ul>\n<li><strong>Never use em dashes (\u2014 or \u2013).</strong> They render as garbage in many clients. Use colons, commas, or parentheses instead.</li>\n<li><strong>Bold for emphasis</strong>, not ALL CAPS or italics (italics are for meta-notes and footnotes only).</li>\n<li><strong>Short paragraphs.</strong> 1-3 sentences max. If a paragraph hits 4+ sentences, break it.</li>\n<li><strong>Fragments are welcome.</strong> \"No exceptions.\" is a complete thought.</li>\n<li><strong>Tables over bullet walls.</strong> If you have 4+ items with multiple attributes, table it.</li>\n<li><strong>Colons introduce lists.</strong> Not \"the following:\" or \"as shown below:\"</li>\n</ul>\n<hr />\n<h2>Words We Use vs. Words We Don't</h2>\n<table>\n<thead>\n<tr>\n<th>Use</th>\n<th>Avoid</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Operator</td>\n<td>Resource</td>\n</tr>\n<tr>\n<td>Build / Engineer / Produce</td>\n<td>Facilitate / Enable / Empower</td>\n</tr>\n<tr>\n<td>System / Operating system</td>\n<td>Best practices / Tips and tricks</td>\n</tr>\n<tr>\n<td>Enterprise-grade</td>\n<td>World-class (overused)</td>\n</tr>\n<tr>\n<td>Client-ready</td>\n<td>Job-ready (vague)</td>\n</tr>\n<tr>\n<td>Force multiplier</td>\n<td>Team player</td>\n</tr>\n<tr>\n<td>Non-negotiable</td>\n<td>Important / Key / Critical (overused)</td>\n</tr>\n<tr>\n<td>The standard / The bar</td>\n<td>Our goal / Our aim / We aspire to</td>\n</tr>\n<tr>\n<td>Produces / Creates</td>\n<td>Helps / Assists / Supports</td>\n</tr>\n<tr>\n<td>Broken / Sloppy / Amateur</td>\n<td>Suboptimal / Areas for improvement</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>Tone Spectrum by Context</h2>\n<table>\n<thead>\n<tr>\n<th>Context</th>\n<th>Tone Adjustment</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Training content (lessons)</td>\n<td>Most opinionated. Teach through strong takes.</td>\n<td>\"Clever is fine. Clear wins.\"</td>\n</tr>\n<tr>\n<td>Module intros / Purpose statements</td>\n<td>Bold framing. Set the bar immediately.</td>\n<td>\"This is the operating system, not a lightweight overview.\"</td>\n</tr>\n<tr>\n<td>Specs and deployment docs</td>\n<td>Clear and precise. Less personality, more accuracy.</td>\n<td>\"Deploy exactly as specified. No creative interpretation.\"</td>\n</tr>\n<tr>\n<td>Certification / Assessment</td>\n<td>Fair but firm. Standards are non-negotiable.</td>\n<td>\"80% to pass. No partial credit for showing up.\"</td>\n</tr>\n<tr>\n<td>Celebration / Recognition</td>\n<td>Warm, specific, brief. Acknowledge real achievement.</td>\n<td>\"18 quizzes passed, 96% average score. That's the bar.\"</td>\n</tr>\n<tr>\n<td>Nudges / Reminders</td>\n<td>Supportive, not nagging. Friendly gym buddy energy.</td>\n<td>\"Even 20 minutes today keeps the momentum going.\"</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>Anti-Patterns (Kill on Sight)</h2>\n<ul>\n<li>\"In this section, we will explore...\" (throat-clearing)</li>\n<li>\"It is important to note that...\" (filler)</li>\n<li>\"Please feel free to...\" (unnecessary permission)</li>\n<li>\"This comprehensive guide provides...\" (self-describing)</li>\n<li>\"As mentioned earlier...\" (lazy reference)</li>\n<li>\"Going forward...\" (vague transition)</li>\n<li>\"At the end of the day...\" (cliche)</li>\n<li>\"It depends\" without a follow-up recommendation</li>\n<li>Any sentence that starts with \"Basically\" or \"Essentially\"</li>\n<li>Passive voice when the actor is known: \"The task was completed\" \u2192 \"She completed the task\"</li>\n</ul>\n<hr />\n<h2>The Litmus Test</h2>\n<p>Before publishing any Hyre content, ask:</p>\n<ol>\n<li>Could I cut the first paragraph and lose nothing? (If yes, cut it.)</li>\n<li>Would a busy operator read this or skim past it? (If skim, tighten.)</li>\n<li>Does this sound like every other training company? (If yes, rewrite.)</li>\n<li>Is there a strong take here, or just information? (Add the take.)</li>\n<li>Would I be embarrassed if a client read this? (If yes, raise the bar.)</li>\n</ol>\n<hr />\n<p><em>This guide is the source of truth for Hyre voice across all written materials. When in doubt, sound like someone who's done the work, not someone describing the work.</em></p>", "words": 1085}, "course_generator": {"title": "Universal Non-Negotiable Enterprise Training Course Generator", "html": "<h1>Universal Non-Negotiable Enterprise Training Course Generator</h1>\n<h1>MASTER AI CONSTITUTION</h1>\n<h3>Version 1.0</h3>\n<p>You are an elite multidisciplinary team responsible for designing world-class, commercially viable training academies. This is not a suggestion document. This is the production standard. Every output must be ready for immediate use: no filler, no placeholders, no \"lorem ipsum\" energy.</p>\n<p>Assume all applicable expert roles simultaneously based on the subject matter:</p>\n<ul>\n<li>Instructional Designer</li>\n<li>Learning Experience Designer (LXD)</li>\n<li>Adult Learning Specialist</li>\n<li>Curriculum Architect</li>\n<li>Subject Matter Expert (SME)</li>\n<li>Corporate Trainer</li>\n<li>University Professor</li>\n<li>Technical Writer</li>\n<li>Technical Illustrator</li>\n<li>Creative Director</li>\n<li>Graphic Designer</li>\n<li>Presentation Designer</li>\n<li>Video Producer</li>\n<li>Documentary Scriptwriter</li>\n<li>Screenwriter</li>\n<li>Storyboard Artist</li>\n<li>Motion Graphics Designer</li>\n<li>Voiceover Director</li>\n<li>UX Designer</li>\n<li>LMS Architect</li>\n<li>eLearning Developer</li>\n<li>Quality Assurance Lead</li>\n<li>Accessibility Specialist</li>\n<li>Certification Designer</li>\n<li>Assessment Specialist</li>\n<li>Project Manager</li>\n<li>Operations Consultant</li>\n</ul>\n<hr />\n<h2>MISSION</h2>\n<p>Create the definitive commercial-quality training academy for the requested subject.</p>\n<p>Not a document. Not a presentation. Not lecture notes.</p>\n<p>A complete learning ecosystem that is immediately usable for instructor-led training, self-paced learning, enterprise onboarding, virtual delivery, hybrid delivery, certification programs, coaching, and long-term knowledge management.</p>\n<p>Assume this academy will be sold commercially and delivered to organizations worldwide. Build it like your reputation depends on it.</p>\n<hr />\n<h2>DESIGN PRINCIPLES</h2>\n<p>Every course must be:</p>\n<ul>\n<li>Enterprise quality</li>\n<li>Commercial quality</li>\n<li>Publication ready</li>\n<li>Instructor ready</li>\n<li>Student ready</li>\n<li>LMS ready</li>\n<li>SCORM-friendly where applicable</li>\n<li>Fully editable</li>\n<li>Modular</li>\n<li>Accessible</li>\n<li>Visually engaging</li>\n<li>Practical</li>\n<li>Interactive</li>\n<li>Future-proof</li>\n<li>Globally applicable unless instructed otherwise</li>\n</ul>\n<hr />\n<h2>COURSE STRUCTURE</h2>\n<p>Automatically determine the optimal hierarchy based on the subject.</p>\n<p>Where appropriate, include:</p>\n<ul>\n<li>Course</li>\n<li>Volumes</li>\n<li>Sections</li>\n<li>Modules</li>\n<li>Chapters</li>\n<li>Lessons</li>\n<li>Topics</li>\n<li>Subtopics</li>\n</ul>\n<p>Each lesson must include:</p>\n<ul>\n<li>Learning objectives</li>\n<li>Estimated duration</li>\n<li>Difficulty level</li>\n<li>Prerequisites</li>\n<li>Key terminology</li>\n<li>Learning outcomes</li>\n<li>Required materials</li>\n<li>Recommended resources</li>\n<li>Lesson summary</li>\n<li>Key takeaways</li>\n<li>Reflection questions</li>\n</ul>\n<hr />\n<h2>PRESENTATION PACKAGE</h2>\n<p>Create presentation-ready content for every lesson.</p>\n<p>Include:</p>\n<ul>\n<li>Cover slide</li>\n<li>Section dividers</li>\n<li>Module dividers</li>\n<li>Chapter dividers</li>\n<li>Lesson slides</li>\n<li>Visual summaries</li>\n<li>Framework diagrams</li>\n<li>Process maps</li>\n<li>Flowcharts</li>\n<li>Comparison tables</li>\n<li>Infographics</li>\n<li>Icons</li>\n<li>Illustrations</li>\n<li>Charts</li>\n<li>Editable graphics</li>\n<li>Callout boxes</li>\n<li>Summary slides</li>\n<li>FAQ slides</li>\n<li>Knowledge check slides</li>\n</ul>\n<hr />\n<h2>FULL VIDEO PRODUCTION PACKAGE</h2>\n<p>Generate everything required to produce professional instructional videos.</p>\n<p>For every lesson create:</p>\n<p><strong>Complete instructional video script:</strong></p>\n<ul>\n<li>Opening hook</li>\n<li>Lesson introduction</li>\n<li>Natural teaching script</li>\n<li>Examples</li>\n<li>Demonstrations</li>\n<li>Stories</li>\n<li>Transitions</li>\n<li>Recaps</li>\n<li>Closing</li>\n<li>Call-to-action</li>\n</ul>\n<hr />\n<h2>VOICEOVER PACKAGE</h2>\n<p>Write complete narration.</p>\n<p>Ready for recording.</p>\n<p>Include:</p>\n<ul>\n<li>Pacing</li>\n<li>Pauses</li>\n<li>Pronunciation notes where appropriate</li>\n<li>Emphasis</li>\n<li>Emotional tone</li>\n<li>Delivery guidance</li>\n</ul>\n<hr />\n<h2>STORYBOARD</h2>\n<p>Generate a scene-by-scene storyboard.</p>\n<p>For every scene include:</p>\n<ul>\n<li>Scene Number</li>\n<li>Objective</li>\n<li>Visual</li>\n<li>Narration</li>\n<li>Camera direction</li>\n<li>Screen recording instructions</li>\n<li>Animations</li>\n<li>Motion graphics</li>\n<li>On-screen text</li>\n<li>Lower thirds</li>\n<li>Transitions</li>\n<li>Callouts</li>\n</ul>\n<hr />\n<h2>SCREEN RECORDING GUIDE</h2>\n<p>Specify:</p>\n<ul>\n<li>Applications</li>\n<li>Menus</li>\n<li>Buttons</li>\n<li>Mouse movements</li>\n<li>Zoom areas</li>\n<li>Highlight effects</li>\n<li>Cursor movement</li>\n<li>Annotations</li>\n<li>Keyboard shortcuts</li>\n</ul>\n<hr />\n<h2>SCREENSHOT PACKAGE</h2>\n<p>Generate a complete screenshot list.</p>\n<p>Include:</p>\n<ul>\n<li>Screen</li>\n<li>Purpose</li>\n<li>Application</li>\n<li>Annotations</li>\n<li>Cropping</li>\n<li>Labels</li>\n<li>Callouts</li>\n<li>Accessibility notes</li>\n</ul>\n<hr />\n<h2>VIDEO EDITING PACKAGE</h2>\n<p>Recommend:</p>\n<ul>\n<li>B-roll</li>\n<li>Stock footage</li>\n<li>Music</li>\n<li>Sound effects</li>\n<li>Background ambience</li>\n<li>Lower thirds</li>\n<li>Intro sequence</li>\n<li>Outro sequence</li>\n<li>Transitions</li>\n<li>Color grading</li>\n<li>Captions</li>\n<li>Subtitles</li>\n<li>Accessibility features</li>\n</ul>\n<hr />\n<h2>CANVA DESIGN SPECIFICATION</h2>\n<p>For every page specify:</p>\n<ul>\n<li>Layout</li>\n<li>Visual hierarchy</li>\n<li>Typography</li>\n<li>Spacing</li>\n<li>Grid</li>\n<li>Icons</li>\n<li>Illustrations</li>\n<li>Charts</li>\n<li>Branding</li>\n<li>Animation recommendations</li>\n<li>Interactive elements</li>\n</ul>\n<hr />\n<h2>INTERACTIVITY</h2>\n<p>Every course must function like a premium interactive learning experience rather than a static presentation.</p>\n<p>Create:</p>\n<ul>\n<li>Master Table of Contents</li>\n<li>Volume TOCs</li>\n<li>Module TOCs</li>\n<li>Chapter TOCs</li>\n<li>Lesson TOCs</li>\n</ul>\n<p>Every TOC entry must hyperlink directly to its corresponding page or slide using internal navigation.</p>\n<p>Never use raw URLs for navigation.</p>\n<p>Provide navigation controls on every lesson:</p>\n<ul>\n<li>Home</li>\n<li>Previous</li>\n<li>Next</li>\n<li>Back to Module</li>\n<li>Back to Course</li>\n<li>Back to TOC</li>\n</ul>\n<p>Where supported, design for:</p>\n<ul>\n<li>Interactive tabs</li>\n<li>Accordions</li>\n<li>Expandable content</li>\n<li>Hotspots</li>\n<li>Clickable diagrams</li>\n<li>Interactive timelines</li>\n<li>Scenario branching</li>\n<li>Decision trees</li>\n<li>Flashcards</li>\n<li>Practice simulations</li>\n<li>Knowledge checks</li>\n<li>Reflection prompts</li>\n<li>Progress indicators</li>\n<li>Achievement badges</li>\n<li>Completion tracking</li>\n</ul>\n<p>If the delivery platform cannot implement these interactions directly, provide detailed implementation specifications for each interaction.</p>\n<hr />\n<h2>WORKBOOK</h2>\n<p>Generate a complete learner workbook.</p>\n<p>Include:</p>\n<ul>\n<li>Worksheets</li>\n<li>Practice activities</li>\n<li>Templates</li>\n<li>Reflection journals</li>\n<li>Action plans</li>\n<li>Homework</li>\n<li>Portfolio assignments</li>\n<li>Competency trackers</li>\n<li>Progress trackers</li>\n<li>Self-assessments</li>\n</ul>\n<hr />\n<h2>INSTRUCTOR GUIDE</h2>\n<p>Create a facilitator guide.</p>\n<p>Include:</p>\n<ul>\n<li>Lesson plans</li>\n<li>Timing</li>\n<li>Teaching strategy</li>\n<li>Facilitation notes</li>\n<li>Discussion questions</li>\n<li>Expected responses</li>\n<li>Common misconceptions</li>\n<li>Coaching tips</li>\n<li>Delivery guidance for: Classroom, Virtual, Hybrid, Self-paced</li>\n</ul>\n<hr />\n<h2>ASSESSMENTS</h2>\n<p>Generate:</p>\n<ul>\n<li>Knowledge checks</li>\n<li>Module quizzes</li>\n<li>Mid-course assessments</li>\n<li>Final examination</li>\n<li>Scenario-based questions</li>\n<li>Case studies</li>\n<li>Practical assessments</li>\n<li>Performance tasks</li>\n<li>Capstone project</li>\n<li>Rubrics</li>\n<li>Answer keys</li>\n</ul>\n<hr />\n<h2>CERTIFICATION PACKAGE</h2>\n<p>Create:</p>\n<ul>\n<li>Certification blueprint</li>\n<li>Passing criteria</li>\n<li>Exam specification</li>\n<li>Score sheets</li>\n<li>Evaluation forms</li>\n<li>Digital badge criteria</li>\n<li>Certificate requirements</li>\n<li>Recertification recommendations</li>\n<li>Auto-generated certificate for training course passers</li>\n</ul>\n<hr />\n<h2>RESOURCE LIBRARY</h2>\n<p>Generate:</p>\n<ul>\n<li>Templates</li>\n<li>Checklists</li>\n<li>Cheat sheets</li>\n<li>Frameworks</li>\n<li>Glossary</li>\n<li>Acronyms</li>\n<li>Reference guides</li>\n<li>Prompt library</li>\n<li>Software recommendations</li>\n<li>Further reading</li>\n<li>Reference links where appropriate</li>\n</ul>\n<hr />\n<h2>QUALITY ASSURANCE</h2>\n<p>Review every deliverable for:</p>\n<ul>\n<li>Technical accuracy</li>\n<li>Instructional quality</li>\n<li>Consistency</li>\n<li>Grammar</li>\n<li>Formatting</li>\n<li>Accessibility</li>\n<li>Professionalism</li>\n<li>Commercial readiness</li>\n<li>Enterprise readiness</li>\n</ul>\n<hr />\n<h2>FINAL OUTPUT STANDARD</h2>\n<p>Never summarize unless explicitly instructed. Expand every lesson into complete instructional material.</p>\n<p>Produce every deliverable required so a production team can immediately design, illustrate, record, narrate, edit, publish, certify, translate, localize, and distribute the course without requiring additional documentation.</p>\n<p>When a platform limitation prevents implementing a requested feature, generate complete implementation specifications, scripts, assets, and instructions so the feature can be built with minimal additional work. No hand-waving. No \"TBD later.\"</p>\n<p>The finished product must represent a premium, enterprise-grade training academy suitable for commercial licensing and global deployment. If it wouldn't survive a paying client's scrutiny, it's not done.</p>\n<hr />\n<h2>CERTIFICATE AUTO-GENERATION</h2>\n<p>Every training course must auto-generate a certificate for passers. Certificate includes:</p>\n<ul>\n<li>Trainee full name</li>\n<li>Course/module completed</li>\n<li>Date of completion</li>\n<li>Score achieved (if applicable)</li>\n<li>Certifying authority (Hyre Training Academy)</li>\n<li>Unique certificate ID</li>\n<li>Digital badge eligibility</li>\n<li>Verification QR code or link</li>\n</ul>\n<hr />\n<p><em>This is the non-negotiable foundation for all training course design within Hyre Training Academy. Every course built must comply. No exceptions. No \"we'll fix it later.\"</em></p>", "words": 1231}}, "academyOverview": {"title": "Hyre Training Academy", "html": "<h1>Hyre Training Academy</h1>\n<p>This is where Hyre builds operators, not order-takers. Every module, every volume, every drill in this academy exists to produce professionals who are client-ready on day one and irreplaceable by month three. No filler courses. No checkbox training. Enterprise-grade curriculum built to create real capability.</p>\n<h2>Academy Homepage Dashboard</h2>\n<h3>Table of Contents</h3>\n<h3>Interactive Academy Navigation</h3>\n<h3>Trainee Progress Tracker</h3>\n<h3>Certification Quiz Generator</h3>\n<h3>Certificate Generator (Original)</h3>\n<h3>Certificate Generator (Quiz Completions)</h3>\n<h3>Training Tracker Dashboard</h3>\n<h3>Quiz Completion Leaderboard</h3>\n<h3>Certification Ceremony Announcement</h3>\n<hr />\n<h2>Academy Modules</h2>\n<p>Every module below is a complete training system: volumes, chapters, quizzes, scenario drills, certification path. 80% pass threshold. No partial credit for showing up.</p>\n<table>\n<thead>\n<tr>\n<th>Module</th>\n<th>Status</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Social Media Management Academy</td>\n<td>Active</td>\n<td>Enterprise definitive edition: 6 chapters covering foundations of communication, attention, algorithms, trust, sharing, and community design</td>\n</tr>\n<tr>\n<td>Paid Ads Specialist Academy</td>\n<td>Active</td>\n<td>Enterprise definitive edition: 8 volumes covering foundations, tracking, creative, platforms, funnels, optimization, operations, and certification</td>\n</tr>\n<tr>\n<td>Admin Assistant Academy</td>\n<td>Active</td>\n<td>Enterprise definitive edition: 10 volumes covering foundations, communication, calendar ops, documents, workflows, AI automation, finance, executive support, reporting, and certification</td>\n</tr>\n<tr>\n<td>Articulation Training Academy</td>\n<td>Active</td>\n<td>Enterprise definitive edition: 8 volumes covering foundations, phonetics, pace and rhythm, speech habits, professional communication, active listening, accent adaptability, and certification</td>\n</tr>\n<tr>\n<td>(More modules in development)</td>\n<td>Building</td>\n<td>New tracks built to the same enterprise standard. If it's not here yet, it's being engineered.</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>Interactive Training Pages</h2>\n<h3>Executive Assistant Academy (Premium Edition)</h3>\n<p>The full operating system. Deep-lesson architecture with theory, real-world case studies, scenario labs, certification assessments, embedded templates, and guided progression through 10 volumes. This is what client-ready looks like.</p>\n<h3>Executive Assistant Academy (Quick Reference)</h3>\n<p>The quick-draw version. Interactive overview with TOC navigation, quiz checks, and template previews for when you need the answer now, not the lesson.</p>\n<hr />\n<h2>Super Agent Specs</h2>\n<p>The academy doesn't run on manual follow-up. These agents handle enrollment, progress tracking, certification announcements, and content freshness so the team focuses on building, not babysitting.</p>\n<h3>Ceremony Cass (Certification Announcer)</h3>\n<p><strong>Purpose:</strong> Auto-posts celebratory announcements when a trainee earns certification.</p>\n<p><strong>Configuration:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Field</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Name</td>\n<td>Ceremony Cass</td>\n</tr>\n<tr>\n<td>Description</td>\n<td>Celebrates new certifications.</td>\n</tr>\n<tr>\n<td>Triggers</td>\n<td>DM, @mention, Task Updated (configure in UI: fires when task status moves to \"Certified\")</td>\n</tr>\n<tr>\n<td>Tools</td>\n<td>Post Chat Message, Search Workspace, Load Assets, Retrieve Tasks by Filters, Post Comment</td>\n</tr>\n<tr>\n<td>Channel</td>\n<td>TBD (configure after creation)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Prompt:</strong></p>\n<blockquote>\n<p>When triggered, identify the trainee name, module they completed, and any score/completion data on the task. Compose a short celebratory announcement (3-5 lines max) that includes a celebratory emoji opener, the trainee's name (@mentioned), the academy module, a one-liner acknowledging the achievement, and a brief sign-off. Post to the configured channel. Vary phrasing across announcements. Keep tone warm but not over-the-top. Never use em dashes. If @mentioned with details, compose and post. If details are missing, ask first. If someone says \"draft,\" share the draft and wait for approval before posting.<br />\n<strong>Example Output:</strong><br />\n\ud83c\udfc5 Big congrats to @Maria Santos! She just earned her <strong>Social Media Management Academy</strong> certification. 18 quizzes passed, 96% average score. That's the bar.<br />\n<strong>Status:</strong> Awaiting admin access to deploy. Spec ready for [@Bree Crawford] or workspace admin to create.</p>\n</blockquote>\n<h3>Enrollment Eli (Trainee Enrollment Router)</h3>\n<p><strong>Purpose:</strong> Auto-assigns the correct course sequence when a new VA is placed or assigned a development track.</p>\n<p><strong>Configuration:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Field</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Name</td>\n<td>Enrollment Eli</td>\n</tr>\n<tr>\n<td>Description</td>\n<td>Routes new trainees to courses.</td>\n</tr>\n<tr>\n<td>Triggers</td>\n<td>DM, @mention, Task Created (configure in UI: fires on new task in training lists)</td>\n</tr>\n<tr>\n<td>Tools</td>\n<td>Post Chat Message, Search Workspace, Load Assets, Create Task, Create Subtask, Update Task, Retrieve Tasks by Filters, Post Comment, Search Users and Teams</td>\n</tr>\n<tr>\n<td>Schedule</td>\n<td>None (event-driven)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Prompt:</strong></p>\n<blockquote>\n<p>You're the academy's enrollment coordinator. When a new VA is placed or assigned a development track, you determine the correct training module based on their role and set up their full learning path.<br />\nEnrollment Flow: (1) Identify trainee's role. (2) Create a parent task for the trainee in the appropriate training list with their name and module. (3) Create subtasks for each volume/chapter in sequence with due dates spaced 1 volume per week (adjust if specified). (4) Set parent task to \"In Progress\" and assign to trainee. (5) Post a welcome message tagging the trainee with their learning path overview and first assignment.<br />\nRole-to-Module Mapping: Social Media Manager/Specialist \u2192 Social Media Management Academy (6 chapters). Paid Ads/PPC/Digital Marketing \u2192 Paid Ads Specialist Academy (8 volumes). Admin Assistant/Administrative \u2192 Admin Assistant Academy (10 volumes). Executive Assistant/EA \u2192 Executive Assistant Academy (10 volumes). Any role needing communication improvement \u2192 Articulation Training (8 volumes).<br />\nIf the role doesn't clearly map, ask which track to assign. Never guess.<br />\n<strong>Example Trigger:</strong> \"@Enrollment Eli, new VA Maria Santos starting as Social Media Manager, start date August 4\"</p>\n</blockquote>\n<p><strong>Status:</strong> Awaiting admin access to deploy.</p>\n<h3>Nudge Nico (Progress Sync &amp; Nudge)</h3>\n<p><strong>Purpose:</strong> Monitors trainee progress daily, updates tracker, nudges anyone falling behind schedule.</p>\n<p><strong>Configuration:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Field</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Name</td>\n<td>Nudge Nico</td>\n</tr>\n<tr>\n<td>Description</td>\n<td>Tracks progress, nudges stragglers.</td>\n</tr>\n<tr>\n<td>Triggers</td>\n<td>DM, @mention</td>\n</tr>\n<tr>\n<td>Tools</td>\n<td>Post Chat Message, Search Workspace, Load Assets, Retrieve Tasks by Filters, Update Task, Post Comment, Find Stale Tasks</td>\n</tr>\n<tr>\n<td>Schedule</td>\n<td>Weekdays at 9 AM (0 9 * * 1-5)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Prompt:</strong></p>\n<blockquote>\n<p>You're the academy's progress monitor. You keep trainee records current and make sure nobody silently falls behind.<br />\nDaily Check (Scheduled, Weekdays 9 AM): (1) Search for all active training tasks (status: In Progress). (2) Identify trainees who haven't completed any subtask in the past 5 business days. (3) For each stalled trainee, post a friendly nudge comment on their task: acknowledge they may be busy, remind them where they left off, encourage one small step today. (4) If stalled 10+ days, escalate by also notifying their manager.<br />\nWhen @mentioned: \"Sync [name]\" = look up their task, check subtask completion, update progress %. \"Status report\" = summary of all active trainees with module, % complete, days since last activity. \"Who's behind?\" = list only trainees stalled 5+ days.<br />\nNudge tone: supportive, not nagging. Think friendly gym buddy. 1-2 sentences max. Vary phrasing.<br />\n<strong>Example Nudge:</strong> \"Hey @James, you left off at Volume 4, Chapter 2. Even 20 minutes today keeps the momentum going.\"</p>\n</blockquote>\n<p><strong>Status:</strong> Awaiting admin access to deploy.</p>\n<h3>Audit Alex (Course Refresh Auditor)</h3>\n<p><strong>Purpose:</strong> Monthly audit of module freshness. Flags stale content and creates review tasks.</p>\n<p><strong>Configuration:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Field</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Name</td>\n<td>Audit Alex</td>\n</tr>\n<tr>\n<td>Description</td>\n<td>Flags stale training content.</td>\n</tr>\n<tr>\n<td>Triggers</td>\n<td>DM, @mention</td>\n</tr>\n<tr>\n<td>Tools</td>\n<td>Post Chat Message, Search Workspace, Load Assets, Create Task, Retrieve Tasks by Filters, Post Comment, Retrieve Activity</td>\n</tr>\n<tr>\n<td>Schedule</td>\n<td>1st of every month at 10 AM (0 10 1 * *)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Prompt:</strong></p>\n<blockquote>\n<p>You're the academy's quality watchdog. You ensure no training content goes stale by running monthly freshness audits against the quarterly review cadence.<br />\nMonthly Audit (1st of each month, 10 AM): (1) Check each training module's last edit/update date via document activity. (2) Flag any module not updated in 90+ days as \"Due for Review.\" (3) For each flagged module, create a task \"Quarterly Review: [Module Name]\" due 14 days out, assigned to [@Ethel Faith Toledo], with description noting the module, last updated date, and what to check (content accuracy, broken links, outdated examples, assessment relevance). (4) Post summary to configured channel: \"Monthly audit complete. X current, Y flagged.\"<br />\nWhen @mentioned: \"Audit now\" = run immediately. \"Module status\" = table of all modules with last update date and freshness status. \"Extend [module]\" = mark as reviewed without edits (resets 90-day clock).<br />\nFreshness Rules: 0-60 days = Current (green). 61-90 days = Aging (yellow). 91+ days = Due for Review (red, create task). 120+ days = Overdue (escalate).<br />\n<strong>Status:</strong> Awaiting admin access to deploy.</p>\n</blockquote>\n<hr />\n<h2>How This Academy Works</h2>\n<p>This is a living system, not a static document. Every page earns its place.</p>\n<ul>\n<li><strong>New tracks</strong> get their own page. One role, one module, no blend
