ing.</li>\n<li><strong>Chapters and lessons</strong> nest as sub-pages under their module. Sequential. Progressive. No skipping.</li>\n<li><strong>Interactive builds</strong> (quizzes, drills, trackers) are embedded directly. If it can be practiced here, it lives here.</li>\n<li><strong>Access is intentional.</strong> Share with the people doing the work. Not spectators.</li>\n</ul>\n<p>If a module exists in this academy, it meets the Training Standards Compliance Framework. No exceptions. If it doesn't meet the standard, it doesn't go live.</p>\n<hr />\n<p><em>Launched July 2026. This academy grows when the team grows. Every new role, every new capability gap, every new standard: it gets built here, tested here, and certified here.</em></p>", "words": 1543}}
</script>

<script>

(function(){
  "use strict";

  var DATA = JSON.parse(document.getElementById('content-data').textContent);
  var MODULES = DATA.modules;
  var MODULE_ORDER = ["executive-assistant","admin-assistant","social-media","paid-ads","articulation"];

  var THEME = {
    "executive-assistant": {code:"EA", color:"#F2A93B"},
    "admin-assistant": {code:"AA", color:"#5B8DEF"},
    "articulation": {code:"AR", color:"#FF6EC7"},

  var root = document.getElementById('app');

  // ---------------- Utilities ----------------
  function h(tag, attrs, children){
    var el = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === 'class') el.className = attrs[k];
      else if(k === 'html') el.innerHTML = attrs[k];
      else if(k.indexOf('on') === 0) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c){
      if(c == null) return;
      if(typeof c === 'string') el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    });
    return el;
  }

  function chip(slug, size){
    var t = THEME[slug];
    var d = h('div', {class:'module-chip', style:'background:'+t.color+(size?';width:'+size+'px;height:'+size+'px':'')}, [t.code]);
    return d;
  }

  function buildNavItems(mod){
    // Returns flat ordered list of {id, title, groupTitle, kind, doc, sub}
    var items = [];
    items.push({id:'overview', title:'Program Overview', kind:'overview', doc:mod.overview, group:'Start Here'});
    if(mod.volumes && mod.volumes.length){
      mod.volumes.forEach(function(v){
        if(v.single){
          items.push({id:v.id, title:v.title, kind:'volume', doc:v.single, group:'Curriculum'});
        } else {
          items.push({id:v.id, title:v.title, kind:'volume', doc:v.overview, group:'Curriculum'});
          (v.lessons||[]).forEach(function(l, i){
            items.push({id:v.id+'-l'+(i+1), title:l.title, kind:'lesson', doc:l, group:'Curriculum', parent:v.id});
          });
        }
      });
    }
    if(mod.resources && mod.resources.length){
      mod.resources.forEach(function(r, i){
        items.push({id:'res-'+i, title:r.title, kind:'resource', doc:r, group:'Toolkit'});
      });
    }
    items.push({id:'standards', title:'Standards & Compliance', kind:'standards', doc:mod.standards, group:'Reference'});
    return items;
  }

  // ---------------- Router ----------------
  function parseHash(){
    var h2 = location.hash.replace(/^#\/?/, '');
    var parts = h2.split('/').filter(Boolean);
    return parts;
  }

  function navigate(){
    window.scrollTo(0,0);
    var parts = parseHash();
    root.innerHTML = '';
    closeMobileNav();
    if(parts.length === 0){ renderHome(); highlightNav(''); return; }
    if(parts[0] === 'modules'){ location.hash = '#/portals'; return; }
    if(parts[0] === 'standards'){ location.hash = '#/portals'; return; }
    if(parts[0] === 'about'){ renderAbout(); highlightNav('about'); return; }
    if(parts[0] === 'enrollment'){ renderEnrollment(); highlightNav('enrollment'); return; }
    if(parts[0] === 'portals'){ renderPortalChooser(); highlightNav('portals'); return; }
    if(parts[0] === 'portal' && parts[1] === 'va'){ renderVAPortal(); highlightNav('portals'); return; }
    if(parts[0] === 'portal' && parts[1] === 'client'){ renderClientPortal(); highlightNav('portals'); return; }
    if(parts[0] === 'portal' && parts[1] === 'internal'){ renderInternalPortal(); highlightNav('portals'); return; }
    if(parts[0] === 'module' && parts[1] && MODULES[parts[1]]){ renderModuleDetail(parts[1]); highlightNav(''); return; }
    if(parts[0] === 'learn' && parts[1] && MODULES[parts[1]]){ renderLMS(parts[1], parts[2]); highlightNav(''); return; }
    renderNotFound();
  }
  window.addEventListener('hashchange', navigate);

  function highlightNav(key){
    document.querySelectorAll('.navlinks a').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-nav') === key);
    });
  }

  function closeMobileNav(){
    var nl = document.querySelector('.navlinks');
    if(nl) nl.classList.remove('open');
  }

  // ---------------- Home ----------------
  function renderHome(){
    var totalVolumes = MODULE_ORDER.reduce(function(a,s){return a + MODULES[s].volCount;},0);
    var hero = h('section', {class:'hero'}, [
      h('div', {class:'wrap'}, [
        h('span', {class:'eyebrow'}, [h('span',{class:'dot'}), 'Hyre Training Academy']),
        h('h1', {}, ['This is where Hyre builds ', h('em',{},['operators']), ', not order-takers.']),
        h('p', {class:'lede'}, ['Every role gets a real curriculum, a certification bar, and a portal built just for them. No filler courses. No checkbox training. Built to produce professionals who are client-ready on day one and irreplaceable by month three.']),
        h('div', {style:'margin-top:32px;padding-top:28px;border-top:1px solid var(--border);max-width:640px;'}, [
          h('span', {class:'section-tag'}, ['Where You Start']),
          h('h2', {style:'font-size:24px;margin:6px 0 10px;'}, ['One academy. Three ways in.']),
          h('p', {style:'margin:0;color:var(--text-dim);font-size:15px;'}, ['VAs train. Clients verify. Operations approves. Everyone gets the exact view they need, built for them, and nothing they don’t.'])
        ]),
        h('div', {class:'hero-actions', style:'margin-top:24px;'}, [
          h('a', {class:'btn btn-primary', href:'#/portals'}, ['Enter Your Portal →']),
          h('a', {class:'btn btn-ghost', href:'#/about'}, ['About the Academy'])
        ]),
        h('div', {class:'hero-stats'}, [
          h('div', {class:'hero-stat'}, [h('div',{class:'num'},['3']), h('div',{class:'label'},['Dedicated Portals'])]),
          h('div', {class:'hero-stat'}, [h('div',{class:'num'},[String(totalVolumes)]), h('div',{class:'label'},['Total Training Volumes'])]),
          h('div', {class:'hero-stat'}, [h('div',{class:'num'},['7']), h('div',{class:'label'},['Mandatory Quality Standards'])]),
          h('div', {class:'hero-stat'}, [h('div',{class:'num'},['80%']), h('div',{class:'label'},['Certification Pass Bar'])])
        ])
      ])
    ]);

    var pillars = h('section', {class:'bordered-top bg-raised'}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'section-head'}, [
          h('span', {class:'section-tag'}, ['Why It Is Different']),
          h('h2', {}, ['Built to a standard most training never meets.'])
        ]),
        h('div', {class:'pillar-grid'}, [
          ['01','Measurable objectives','Every chapter opens with objectives you can actually be tested against. No vague "you will learn about..."'],
          ['02','Diagnostic entry','Every module starts with a baseline assessment that places you at the right depth, not the same starting line as everyone else.'],
          ['03','Real time estimates','Hours are estimated per chapter and per volume, so you know exactly what completion costs before you start.'],
          ['04','Accessible by default','WCAG 2.1 AA compliance is not a stretch goal. It is a requirement before anything goes live.'],
          ['05','Competency-mapped','Every chapter ties to a specific job competency. Nothing is filler. Everything maps to a skill you use.'],
          ['06','Certification, not participation','Passing means 80% and above, evaluated against a real rubric. Certificates are earned, not distributed.']
        ].map(function(p){
          return h('div', {class:'pillar'}, [
            h('div', {class:'num'}, [p[0]]),
            h('h4', {}, [p[1]]),
            h('p', {}, [p[2]])
          ]);
        }))
      ])
    ]);

    var ctaBand = h('section', {}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'cta-band'}, [
          h('h2', {}, ['A weak operator waits for instructions.']),
          h('p', {}, ['A strong one already knows what needs to happen next, and does it before anyone has to ask. That is the standard here. It does not bend for tenure, title, or a bad day.'])
        ])
      ])
    ]);

    root.appendChild(hero);
    root.appendChild(pillars);
    root.appendChild(ctaBand);
    root.appendChild(renderFooter());
  }

  function renderModuleCard(slug){
    var m = MODULES[slug];
    var t = THEME[slug];
    return h('div', {class:'module-card'}, [
      h('span', {class:'status-badge'}, ['Active']),
      chip(slug),
      h('h3', {}, [m.name]),
      h('div', {class:'tagline'}, [m.tagline]),
      h('div', {class:'module-meta'}, [
        h('span', {}, [m.volCount + ' Volumes']),
        h('span', {}, ['~' + m.hours + ' hrs'])
      ]),
      h('div', {class:'card-actions'}, [
        h('a', {class:'btn btn-sm btn-ghost', href:'#/module/'+slug}, ['Details']),
        h('a', {class:'btn btn-sm btn-primary', href:'#/learn/'+slug}, ['Start →'])
      ])
    ]);
  }

  // ---------------- Catalog ----------------
  function renderCatalog(){
    var sec = h('section', {style:'padding-top:56px'}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'section-head'}, [
          h('span', {class:'section-tag'}, ['All Modules']),
          h('h2', {}, ['Five tracks. Zero filler.']),
          h('p', {class:'section-desc'}, ['Every module below meets the Training Standards Compliance Framework. If it does not meet the standard, it does not go live.'])
        ]),
        h('div', {class:'module-grid'}, MODULE_ORDER.map(renderModuleCard))
      ])
    ]);
    root.appendChild(sec);
    root.appendChild(renderFooter());
  }

  // ---------------- Module Detail (marketing page) ----------------
  function renderModuleDetail(slug){
    var m = MODULES[slug];
    var t = THEME[slug];
    var hero = h('div', {class:'module-hero'}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'breadcrumb'}, [h('a',{href:'#/portals'},['Portals']), ' / ', m.short]),
        h('div', {class:'module-hero-top'}, [
          chip(slug, 52),
          h('div', {}, [
            h('h1', {style:'font-size:38px;margin-bottom:8px;'}, [m.name]),
            h('p', {class:'lede', style:'margin:0;font-size:17px;'}, [m.tagline])
          ])
        ]),
        h('div', {class:'stat-row'}, [
          h('div', {class:'stat-box'}, [h('div',{class:'num'},[String(m.volCount)]), h('div',{class:'label'},['Volumes'])]),
          h('div', {class:'stat-box'}, [h('div',{class:'num'},['~'+m.hours]), h('div',{class:'label'},['Est. Hours'])]),
          h('div', {class:'stat-box'}, [h('div',{class:'num'},['80%']), h('div',{class:'label'},['Pass Threshold'])]),
          h('div', {class:'stat-box'}, [h('div',{class:'num'},[PORTFOLIO_REQUIREMENTS[slug] ? '8/8' : '7/7']), h('div',{class:'label'},['Standards Met'])])
        ]),
        h('div', {class:'hero-actions'}, [
          h('a', {class:'btn btn-primary', href:'#/learn/'+slug}, ['Enter Course →']),
          h('a', {class:'btn btn-ghost', href:'#module-curriculum'}, ['View Curriculum'])
        ])
      ])
    ]);

    var curricSec = h('section', {id:'module-curriculum'}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'section-head'}, [
          h('span', {class:'section-tag'}, ['Curriculum']),
          h('h2', {}, ['What this module covers'])
        ]),
        renderCurriculumList(slug)
      ])
    ]);

    var portfolioSec = PORTFOLIO_REQUIREMENTS[slug] ? h('section', {}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'section-head'}, [
          h('span', {class:'section-tag'}, ['Certification Gate']),
          h('h2', {}, ['Completed projects, not just quiz scores']),
          h('p', {class:'section-desc'}, ['Certification in this module requires demonstrated work. This is Standard 8 of the Training Standards Compliance Framework, and it is non-negotiable.'])
        ]),
        renderPortfolioBlock(slug)
      ])
    ]) : null;

    var overviewSec = h('section', {class:'bordered-top bg-raised'}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'section-head'}, [
          h('span', {class:'section-tag'}, ['Program Overview']),
          h('h2', {}, ['Straight from the source document'])
        ]),
        h('div', {class:'content-prose', html: m.overview.html})
      ])
    ]);

    var ctaSec = h('section', {}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'cta-band'}, [
          h('h2', {}, ['Ready to start ' + m.short + '?']),
          h('p', {}, ['Every volume, every framework, every standard: right where you left off.']),
          h('div', {class:'cta-actions'}, [
            h('a', {class:'btn btn-primary', href:'#/learn/'+slug}, ['Enter Course →'])
          ])
        ])
      ])
    ]);

    root.appendChild(hero);
    root.appendChild(curricSec);
    if(portfolioSec) root.appendChild(portfolioSec);
    root.appendChild(overviewSec);
    root.appendChild(ctaSec);
    root.appendChild(renderFooter());
    setTimeout(function(){ linkifyVolumeReferences(overviewSec, slug); }, 0);

  // Turn "Academy Structure" / volume-reference tables into working links to the
  // matching LMS page for that volume, so every volume mention is navigable.
  function linkifyVolumeReferences(container, slug){
    var mod = MODULES[slug];
    if(!mod.volumes || !mod.volumes.length) return;
    var romanMap = {};
    mod.volumes.forEach(function(v){
      var m = v.title.match(/Volume\s+([IVXLCDM]+)/i);
      if(m) romanMap[m[1].toUpperCase()] = v.id;
    });
    var tables = container.querySelectorAll('table');
    tables.forEach(function(table){
      var rows = table.querySelectorAll('tr');
      rows.forEach(function(row, idx){
        if(idx === 0) return; // header row
        var cells = row.querySelectorAll('td');
        if(!cells.length) return;
        var roman = cells[0].textContent.trim().toUpperCase();
        var volId = romanMap[roman];
        if(!volId) return;
        var targetCell = cells.length > 1 ? cells[1] : cells[0];
        if(targetCell.querySelector('a')) return;
        var label = targetCell.textContent;
        var a = document.createElement('a');
        a.href = '#/learn/' + slug + '/' + volId;
        a.style.color = 'var(--accent)';
        a.style.fontWeight = '700';
        a.style.textDecoration = 'underline';
        a.textContent = label;
        targetCell.textContent = '';
        targetCell.appendChild(a);
      });
    });

    // Some modules list volumes as a "Volume Breakdown" ordered list instead of
    // a table (e.g. bold titles in list order). Link those too, by position.
    var headings = container.querySelectorAll('h1,h2,h3,h4,h5,h6');
    headings.forEach(function(heading){
      if (!/volume breakdown/i.test(heading.textContent)) return;
      var list = heading.nextElementSibling;
      while (list && list.tagName !== 'OL' && list.tagName !== 'UL') list = list.nextElementSibling;
      if (!list) return;
      var items = list.querySelectorAll(':scope > li');
      items.forEach(function(li, idx){
        var vol = mod.volumes[idx];
        if (!vol) return;
        var strong = li.querySelector('strong');
        if (!strong || strong.querySelector('a')) return;
        var a = document.createElement('a');
        a.href = '#/learn/' + slug + '/' + vol.id;
        a.style.color = 'var(--accent)';
        a.style.textDecoration = 'underline';
        a.textContent = strong.textContent;
        strong.textContent = '';
        strong.appendChild(a);
      });
    });
  }

  function renderPortfolioBlock(slug){
    var req = PORTFOLIO_REQUIREMENTS[slug];

    var linkCount = req.minProjects;

    var wrap = h('div', {class:'portfolio-block'});

    function renderInner(){
      wrap.innerHTML = '';

        h('div', {class:'std-num'}, ['NON-NEGOTIABLE · CERTIFICATION GATE']),

        ])

          h('h4', {style:'margin:0 0 8px;font-size:16px;color:var(--green);'}, ['✓ Submitted for certification review']),
          h('p', {style:'margin:0;color:var(--text-dim);font-size:14px;'}, ['Your reviewer will confirm receipt and follow up with next steps. This demo site does not send or store submissions anywhere.'])
        ]));
        return;
      }

      var toggleRow = h('div', {class:'flex gap-8', style:'margin-bottom:14px;'}, [
        h('button', {
          class:'btn btn-sm ' + (mode==='individual' ? 'btn-primary' : 'btn-ghost'),
          onclick:function(){ mode='individual'; renderInner(); }
        }, ['Individual project links']),
        h('button', {
          class:'btn btn-sm ' + (mode==='consolidated' ? 'btn-primary' : 'btn-ghost'),
          onclick:function(){ mode='consolidated'; renderInner(); }
        }, ['1 portfolio link (contains all)'])
      ]);

      var fieldsWrap = h('div', {style:'display:flex;flex-direction:column;gap:10px;margin-bottom:14px;'});
      var inputs = [];

      function addField(placeholder){
        var input = h('input', {
          type:'url', placeholder:placeholder, required:'required',
          style:'width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-raised);color:var(--text);font-size:14px;'
        });
        inputs.push(input);
        fieldsWrap.appendChild(input);
      }

      if(mode === 'individual'){
        for(var i=0;i<linkCount;i++){
          addField('Project ' + (i+1) + ' link (e.g. live campaign, drive folder, deck)');
        }
      } else {
        addField('Portfolio link containing all completed projects');
      }

      var controls = h('div', {class:'flex gap-8', style:'align-items:center;flex-wrap:wrap;'}, [
        mode==='individual' ? h('button', {
          class:'btn btn-sm btn-ghost',
          onclick:function(){ linkCount++; renderInner(); }
        }, ['+ Add another project link']) : null,
        h('button', {
          class:'btn btn-primary',
          onclick:function(){
            var allFilled = inputs.every(function(inp){ return inp.value.trim().length > 3; });
            if(!allFilled){
              errMsg.textContent = mode==='individual'
                ? 'Add a link for all ' + linkCount + ' projects before submitting.'
                : 'Add your portfolio link before submitting.';
              errMsg.style.display = 'block';
              return;
            }
            submitted = true;
            renderInner();
          }
        }, ['Submit for Certification Review'])
      ]);

      var errMsg = h('div', {style:'color:var(--red);font-size:13px;display:none;margin-top:8px;'});

      wrap.appendChild(toggleRow);
      wrap.appendChild(fieldsWrap);
      wrap.appendChild(controls);
      wrap.appendChild(errMsg);
    }

    renderInner();
    return wrap;
  }

            h('h3', {}, [MODULES[slug].name]),
            h('div', {class:'progress-track'}, [h('div', {class:'progress-fill', style:'width:'+pct+'%'})]),
            h('div', {class:'progress-label'}, [done + ' / ' + items.length + ' complete (' + pct + '%)']),
            h('div', {class:'module-meta'}, [
              h('span', {}, ['80% pass bar']),
              req ? h('span', {}, [req.minProjects + ' projects required']) : h('span', {}, ['No portfolio required'])
            ]),
            h('div', {class:'card-actions'}, [
              h('a', {class:'btn btn-sm btn-primary', href:'#/learn/'+slug}, [pct > 0 ? 'Resume →' : 'Start →'])
            ])
          ]);
        }))
      ])
    ]);
    root.appendChild(hero);
    root.appendChild(modGrid);
    root.appendChild(renderFooter());
  }

  function renderClientPortal(){
    var hero = h('div', {class:'module-hero'}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'breadcrumb'}, [h('a',{href:'#/portals'},['Portals']), ' / Client Portal']),
        h('span', {class:'eyebrow'}, [h('span',{class:'dot'}), 'Client Portal']),
        h('h1', {style:'font-size:38px'}, ['See exactly what your VA is trained in.']),
        h('p', {class:'lede'}, ['Active Hyre clients only. Every module your VA can be certified in, and the bar they had to clear to get there.'])
      ])
    ]);
    var standardsSec = h('section', {}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'section-head'}, [
          h('span', {class:'section-tag'}, ['What "Certified" Means']),
          h('h2', {}, ['A certificate here is not a participation trophy'])
        ]),
        h('div', {class:'std-grid'}, [
          ['80% pass bar', 'Every volume quiz requires 80% to pass. No partial credit for showing up.'],
          ['Completed projects', 'Where the role produces real work, certification also requires a minimum number of completed projects, not just quiz scores.'],
          ['WCAG 2.1 AA training materials', 'Your VA trained on accessible, professionally built material, the same standard used industry-wide.'],
          ['Competency-mapped', 'Every chapter your VA completed maps to a specific, named job competency, not generic filler.']
        ].map(function(s){
          return h('div', {class:'std-card'}, [
            h('h4', {style:'margin:0 0 8px;font-size:16px;'}, [s[0]]),
            h('p', {style:'margin:0;color:var(--text-dim);font-size:14px;'}, [s[1]])
          ]);
        }))
      ])
    ]);
    var modGrid = h('section', {class:'bordered-top bg-raised'}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'section-head'}, [
          h('span', {class:'section-tag'}, ['Available Tracks']),
          h('h2', {}, ['Modules your VA may be certified in'])
        ]),
        h('div', {class:'module-grid'}, MODULE_ORDER.map(renderModuleCard))
      ])
    ]);
    root.appendChild(hero);
    root.appendChild(standardsSec);
    root.appendChild(modGrid);
    root.appendChild(renderFooter());
  }

  function renderInternalPortal(){
    var hero = h('div', {class:'module-hero'}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'breadcrumb'}, [h('a',{href:'#/portals'},['Portals']), ' / Internal Portal']),
        h('span', {class:'eyebrow'}, [h('span',{class:'dot'}), 'Internal Portal']),
        h('h1', {style:'font-size:38px'}, ['Operations control center.']),
        h('p', {class:'lede'}, ['Hyre Operations only. Review enrollment requests and the access-control rules that govern this academy.'])
      ])
    ]);

    var modGrid = h('section', {}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'section-head'}, [
          h('span', {class:'section-tag'}, ['All Academy Tracks']),
          h('h2', {}, ['Every track operations can approve']),
          h('p', {class:'section-desc'}, ['The tracks currently live in this academy. Every enrollment request must map to one of these, no exceptions.'])
        ]),
        h('div', {class:'module-grid'}, MODULE_ORDER.map(renderModuleCard))
      ])
    ]);

    var formSec = h('section', {class:'bordered-top bg-raised'});
    var formWrap = h('div', {class:'wrap'});
    var formCard = h('div', {class:'std-card', style:'max-width:560px;border-color:var(--accent);'});
    var nameInput, emailInput, roleSelect, statusMsg;

    function buildForm(){
      formCard.innerHTML = '';
      formCard.appendChild(h('div', {class:'std-num'}, ['ENROLLMENT REQUEST']));
      formCard.appendChild(h('h4', {style:'margin:0 0 6px;font-size:17px;'}, ['Submit a new enrollment request']));
      formCard.appendChild(h('p', {style:'margin:0 0 18px;color:var(--text-dim);font-size:13.5px;'}, [
        'Submitting opens a pre-filled, urgent-priority email to ethel@hyreup.com in your default mail app. You still need to hit send there, this static site cannot send email on its own.'
      ]));

      var nameField = h('div', {class:'form-field'}, [h('label',{},['Full Name'])]);
      nameInput = h('input', {type:'text', placeholder:'Jane Dela Cruz'});
      nameField.appendChild(nameInput);

      var emailField = h('div', {class:'form-field'}, [h('label',{},['Email Address'])]);
      emailInput = h('input', {type:'email', placeholder:'jane@example.com'});
      emailField.appendChild(emailInput);

      var roleField = h('div', {class:'form-field'}, [h('label',{},['Requested Track'])]);
      roleSelect = h('select', {}, MODULE_ORDER.map(function(s){
        var opt = h('option', {value:s}, [MODULES[s].name]);
        return opt;
      }));
      roleField.appendChild(roleSelect);

      statusMsg = h('div', {style:'font-size:13px;color:var(--red);display:none;margin-bottom:10px;'});

      var submitBtn = h('button', {class:'btn btn-primary btn-block', onclick:function(){
        var name = nameInput.value.trim();
        var email = emailInput.value.trim();
        var emailOk = /\S+@\S+\.\S+/.test(email);
        if(!name || !emailOk){
          statusMsg.textContent = 'Enter a full name and a valid email address before submitting.';
          statusMsg.style.display = 'block';
          return;
        }
        statusMsg.style.display = 'none';
        var moduleName = MODULES[roleSelect.value].name;
        var subject = 'URGENT: Academy Enrollment Approval Request — ' + name;
        var body = 'Enrollment approval requested.\n\n' +
          'Full Name: ' + name + '\n' +
          'Email: ' + email + '\n' +
          'Requested Track: ' + moduleName + '\n\n' +
          'Submitted via Hyre Training Academy Internal Portal.';
        var mailto = 'mailto:ethel@hyreup.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        window.location.href = mailto;
      }}, ['Send Urgent Approval Request →']);

      formCard.appendChild(nameField);
      formCard.appendChild(emailField);
      formCard.appendChild(roleField);
      formCard.appendChild(statusMsg);
      formCard.appendChild(submitBtn);
    }
    buildForm();
    formWrap.appendChild(h('div', {class:'section-head'}, [
      h('span', {class:'section-tag'}, ['Enrollment Requests']),
      h('h2', {}, ['New request'])
    ]));
    formWrap.appendChild(formCard);
    formSec.appendChild(formWrap);

    var policySec = h('section', {class:'bordered-top bg-raised'}, [
      h('div', {class:'wrap'}, [
        h('div', {class:'section-head'}, [
          h('span', {class:'section-tag'}, ['Access Control Policy']),
          h('h2', {}, ['Access is revoked the moment employment status changes'])
        ]),
        h('div', {class:'policy-card'}, [
          h('span', {class:'policy-tag'}, ['Policy · Requires Backend Integration']),
          h('h4', {style:'margin:0 0 8px;font-size:16px;'}, ['Auto-reject on employment status change']),
          h('p', {style:'margin:0 0 10px;color:var(--text-dim);font-size:14.5px;'}, [
            'Non-negotiable rule: the moment a VA is no longer active, their academy access is automatically revoked. No manual step, no grace period.'
          ]),
          h('p', {style:'margin:0;color:var(--text-faint);font-size:13px;'}, [
            'This is a written policy, not a live feature of this static site. Enforcing it for real requires a backend that automatically revokes the matching academy account the moment employment status changes, the same way enrollment, progress nudges, and certificate issuance are specs awaiting deployment, not yet live automations.'
          ])
        ])
      ])
    ]);

    root.appendChild(hero);
    root.appendChild(modGrid);
    root.appendChild(formSec);
    root.appendChild(policySec);
    root.appendChild(renderFooter());
  }

  // ---------------- Not Found ----------------
  function renderNotFound(){
    root.appendChild(h('section', {}, [
      h('div', {class:'wrap center', style:'padding:100px 0'}, [
        h('h2', {}, ['Page not found']),
        h('a', {class:'btn btn-primary', href:'#/'}, ['Back to Home'])
      ])
    ]));
  }

  // ---------------- LMS Shell ----------------
  function renderLMS(slug, itemId){
    var m = MODULES[slug];
    var items = buildNavItems(m);
    if(!itemId) itemId = items[0].id;
    var current = items.filter(function(it){return it.id === itemId;})[0] || items[0];

    var lms = h('div', {class:'lms'});
    lms.appendChild(renderSidebar(slug, items, current.id));
    lms.appendChild(renderLessonMain(slug, items, current));
    root.appendChild(lms);
  }

  function progressCount(slug, items){
    var p = PROGRESS[slug];
    var done = 0;
    items.forEach(function(it){ if(p[it.id]) done++; });
    return done;
  }

  function renderSidebar(slug, items, activeId){
    var m = MODULES[slug];
    var done = progressCount(slug, items);
    var pct = Math.round((done/items.length)*100);

    var groups = {};
    var groupOrder = [];
    items.forEach(function(it){
      if(!groups[it.group]){ groups[it.group] = []; groupOrder.push(it.group); }
      groups[it.group].push(it);
    });

    var sidebar = h('div', {class:'lms-sidebar', id:'lms-sidebar'}, [
      h('div', {class:'lms-sidebar-head'}, [
        h('a', {href:'#/module/'+slug, style:'color:var(--text-faint);font-size:12.5px;font-weight:700;'}, ['← ' + m.short + ' overview']),
        h('div', {class:'mtitle', style:'margin-top:8px'}, [m.name]),
        h('div', {class:'progress-track'}, [h('div', {class:'progress-fill', id:'progress-fill', style:'width:'+pct+'%'})]),
        h('div', {class:'progress-label', id:'progress-label'}, [done + ' / ' + items.length + ' complete (' + pct + '%)'])
      ])
    ]);

    groupOrder.forEach(function(g){
      var grp = h('div', {class:'lms-nav-group'}, [
        h('div', {class:'lms-nav-group-title'}, [g])
      ]);
      groups[g].forEach(function(it){
        var isSub = it.kind === 'lesson';
        var isDone = !!PROGRESS[slug][it.id];
        var row = h('div', {
          class:'lms-nav-item' + (isSub?' sub':'') + (it.id===activeId?' active':'') + (isDone?' done':''),
          onclick:function(){ location.hash = '#/learn/'+slug+'/'+it.id; }
        }, [
          h('span', {class:'lms-check'}, [isDone?'✓':'']),
          h('span', {}, [it.title])
        ]);
        grp.appendChild(row);
      });
      sidebar.appendChild(grp);
    });

    return sidebar;
  }

  function renderLessonMain(slug, items, current){
    var idx = items.indexOf(current);
    var prev = items[idx-1];
    var next = items[idx+1];
    var m = MODULES[slug];
    var isDone = !!PROGRESS[slug][current.id];

    var main = h('div', {class:'lms-main'}, [
      h('div', {class:'lms-content-wrap'}, [
        h('div', {class:'lesson-topbar'}, [
          h('div', {class:'lesson-eyebrow'}, [m.short + ' · ' + current.group]),
          h('button', {
            class:'btn btn-sm ' + (isDone ? 'btn-ghost' : 'btn-primary'),
            id:'complete-btn',
            onclick:function(){ toggleComplete(slug, items, current); }
          }, [isDone ? '✓ Completed' : 'Mark Complete'])
        ]),
        h('div', {class:'content-prose', html: current.doc.html}),
        current.kind === 'standards' && PORTFOLIO_REQUIREMENTS[slug] ? h('div', {class:'content-prose'}, [
          h('h2', {}, ['Standard 8: Portfolio & Completed Project Submission']),
          h('p', {}, ['Non-negotiable. Applies before this module\'s certificate is issued.']),
          renderPortfolioBlock(slug)
        ]) : null,
        h('div', {class:'lesson-pager'}, [
          prev ? h('a', {class:'btn btn-ghost', href:'#/learn/'+slug+'/'+prev.id}, ['← ' + prev.title]) : h('span', {}),
          next ? h('a', {class:'btn btn-primary', href:'#/learn/'+slug+'/'+next.id}, [next.title + ' →']) : h('a', {class:'btn btn-primary', href:'#/module/'+slug}, ['Finish Module →'])
        ])
      ])
    ]);

    setTimeout(function(){ enhanceQuizzes(main); linkifyVolumeReferences(main, slug); }, 0);
    return main;
  }

  function toggleComplete(slug, items, current){
    if(PROGRESS[slug][current.id]) delete PROGRESS[slug][current.id];
    else PROGRESS[slug][current.id] = true;
    // Re-render LMS in place (cheap full re-render of #app)
    var itemId = current.id;
    root.innerHTML = '';
    renderLMS(slug, itemId);
  }

  // Turn "Correct: X" reveal lines into collapsible answer toggles
  function enhanceQuizzes(container){
    var paras = container.querySelectorAll('.content-prose p, .content-prose li');
    paras.forEach(function(p){
      var strong = p.querySelector('strong');
      if(strong && /^Correct:?$/i.test(strong.textContent.trim())){
        var answerText = p.textContent.replace(/^Correct:?\s*/i, '');
        p.innerHTML = '';
        var btn = document.createElement('button');
        btn.className = 'reveal-btn';
        btn.textContent = 'Reveal Answer';
        var ans = document.createElement('div');
        ans.className = 'reveal-answer';
        ans.textContent = 'Correct: ' + answerText;
        btn.addEventListener('click', function(){
          ans.classList.toggle('show');
          btn.textContent = ans.classList.contains('show') ? 'Hide Answer' : 'Reveal Answer';
        });
        p.appendChild(btn);
        p.appendChild(ans);
      }
    });
  }

  // ---------------- Init ----------------
  renderTopNav();
  navigate();

})();

</script>
</body>
</html>
